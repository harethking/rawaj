<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رواج</title>
<script>
  // Short store links: /rawaj/<store> -> /rawaj/#<store>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var project = /\.github\.io$/.test(location.hostname) && parts.length > 1;
    var base = project ? '/' + parts[0] + '/' : '/';
    var slug = (project ? parts[1] : parts[0]) || '';
    slug = slug.toLowerCase();
    location.replace(base + (/^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$/.test(slug) ? '#' + slug : ''));
  })();
</script>
</head>
<body style="font-family:system-ui;text-align:center;padding:40px">جارِ فتح المتجر…</body>
</html>
