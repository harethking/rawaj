<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رواج — متجرك وحساباته في جيبك</title>
<meta name="description" content="رواج: منصة لإدارة متجرك أونلاين — الطلبات والمخزن والأرباح ورابط متجرك للزبائن.">
<meta name="theme-color" content="#1f6b4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#f5f7f6; --line:#dde3e0; --line-strong:#c5cdc9;
  --ink:#14211f; --muted:#5d6b67; --faint:#8a9692;
  --brand:#1f6b4f;
  --brand-soft:color-mix(in srgb, var(--brand) 12%, var(--surface));
  --brand-ink:#ffffff;
  --new:#1d4ed8; --confirmed:#7c3aed; --preparing:#b45309; --shipped:#0e7490; --delivered:#15803d; --canceled:#6b7280; --returned:#b91c1c;
  --bad:#b91c1c; --good:#15803d; --warn:#b45309;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --nav-h:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1716; --surface:#172220; --sunk:#121b1a; --line:#26332f; --line-strong:#33433e;
    --ink:#e7eeeb; --muted:#9fb0ab; --faint:#74857f;
    --new:#7aa2ff; --confirmed:#b69bff; --preparing:#f2b25c; --shipped:#5cc8dc; --delivered:#5fd18a; --canceled:#9aa3ad; --returned:#ff8a8a;
    --bad:#ff8a8a; --good:#5fd18a; --warn:#f2b25c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --sunk:#121b1a; --line:#26332f; --line-strong:#33433e;
  --ink:#e7eeeb; --muted:#9fb0ab; --faint:#74857f;
  --new:#7aa2ff; --confirmed:#b69bff; --preparing:#f2b25c; --shipped:#5cc8dc; --delivered:#5fd18a; --canceled:#9aa3ad; --returned:#ff8a8a;
  --bad:#ff8a8a; --good:#5fd18a; --warn:#f2b25c;
  color-scheme: dark;
}
:root{--rw:#1f6b4f;--shadow-sm:0 1px 2px rgba(16,32,28,.06),0 1px 1px rgba(16,32,28,.04);--shadow-md:0 2px 6px rgba(16,32,28,.06),0 10px 24px -12px rgba(16,32,28,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 24px -10px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Readex Pro", system-ui, sans-serif; font-size:15px; line-height:1.55;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}

/* Demo notice */

/* Header */
header.top{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
}
.store-mark{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.store-pick{flex:1;min-width:0}
.store-pick select{border:0;background:none;font-weight:600;font-size:16px;padding:0;max-width:100%;appearance:none;-webkit-appearance:none}
.store-pick small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.role-pick{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 8px;font-size:13px}

/* Layout */
.shell{display:flex;min-height:calc(100vh - 100px)}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + 28px);max-width:860px;margin:0 auto;width:100%}
nav.side{display:none}
nav.bottom{
  position:fixed;bottom:0;inset-inline:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line);display:flex;
}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--brand);font-weight:600}
@media (min-width:920px){
  nav.bottom{display:none}
  nav.side{display:flex;flex-direction:column;gap:2px;width:220px;flex:none;padding:16px 12px;border-inline-start:0;border-inline-end:1px solid var(--line);background:var(--surface);position:sticky;top:59px;height:calc(100vh - 59px)}
  nav.side button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);text-align:start}
  nav.side button svg{width:20px;height:20px}
  nav.side button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
  main{padding:24px 28px 40px}
}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1{font-size:22px;font-weight:600;margin:4px 0 14px;letter-spacing:-.2px}
h2{font-size:16px;font-weight:600;margin:24px 0 10px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Order pipeline — the signature element */
.pipeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px 14px;overflow-x:auto}
.pipe-track{display:grid;grid-template-columns:repeat(5,minmax(64px,1fr));position:relative;min-width:340px}
.pipe-track::before{content:"";position:absolute;top:21px;inset-inline:10%;height:2px;background:var(--line-strong)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.stop .dot{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:17px;position:relative}
.stop.hot .dot{background:var(--c);color:#fff}
.stop span{font-size:12px;color:var(--muted)}
.pipe-foot{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.pipe-foot b{color:var(--ink);font-weight:600}

/* Money strip */
.money{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:14px}
@media (min-width:640px){.money{grid-template-columns:repeat(4,1fr)}}
.money div{background:var(--surface);padding:12px 14px}
.money dt{font-size:12.5px;color:var(--muted)}
.money dd{margin:2px 0 0;font-size:18px;font-weight:600}
.money .cod dd{color:var(--shipped)}
.money .neg dd{color:var(--bad)}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--sunk)}
.item .meta{font-size:12.5px;color:var(--muted)}
.ono{font-weight:600;color:var(--muted);font-size:13px;min-width:44px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}

/* Chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;margin-inline-start:4px}

/* Inputs & buttons */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.input{min-height:76px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search .input{padding-inline-start:38px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 16px;min-height:42px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:15;border-radius:16px;box-shadow:0 6px 20px color-mix(in srgb,var(--brand) 35%,transparent)}
@media (min-width:920px){.fab{bottom:24px}}
.err{color:var(--bad);font-size:13px;margin:-4px 0 10px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:40;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;z-index:41;inset-inline:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;
}
.sheet.open{transform:none}
@media (min-width:720px){
  .sheet{inset-inline:auto;left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:86vh;border-radius:20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .16s, transform .16s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
@media (min-width:720px){.grab{display:none}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:18px;font-weight:600;flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1;min-width:120px}

/* Order detail */
.cust{background:var(--sunk);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:8px 0;border-bottom:1px solid var(--line)}
.lines td:last-child{text-align:left}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--muted)}
.tot.grand{color:var(--ink);font-weight:600;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.timeline{list-style:none;padding:0;margin:8px 0 0;border-inline-start:2px solid var(--line);padding-inline-start:14px}
.timeline li{position:relative;padding:4px 0 10px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;inset-inline-start:-20px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--surface)}
.timeline small{color:var(--muted);display:block}

/* Order builder lines */
.oline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.qty{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.qty button{width:32px;height:32px;border:0;background:var(--sunk)}
.qty span{min-width:28px;text-align:center}

/* Products */
.thumb{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:600;font-size:18px;color:#fff}
.vrow{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.vrow .input{min-height:38px;padding:7px 8px;font-size:14px}
.vrow.head{font-size:12px;color:var(--muted)}
.vrow .x{border:0;background:none;color:var(--faint);font-size:18px}

/* Bars */
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding:8px 0 0}
.bars div{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;opacity:.85;position:relative}
.bars div.today{opacity:1}
.bars-x{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}

/* Report table */
.ledger{width:100%;border-collapse:collapse;font-size:14.5px}
.ledger td{padding:10px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:left;font-weight:500}
.ledger tr.sum td{font-weight:600;border-bottom:0;font-size:16px}
.ledger tr.minus td:first-child::before{content:"− ";color:var(--faint)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* Storefront */
.sf{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none}
.sf.open{display:block}
.sf{--accent:color-mix(in srgb,var(--brand) 62%,var(--ink));scroll-behavior:smooth}
.sf [hidden],.sheet [hidden]{display:none !important}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--brand-ink)}
.sf-owner{background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sf-owner button{background:none;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:inherit;border-radius:8px;padding:3px 10px;font-size:12.5px}
.sf-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sf-mark{width:36px;height:36px;border-radius:11px;flex:none;overflow:hidden;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.sf-mark img{width:100%;height:100%;object-fit:cover;display:block}
.sf-top-name{font-weight:600;font-size:16px}
.sf-cart-btn{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sf-cart-btn svg{width:22px;height:22px}
.sf-count{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:11.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}
.sf-hero{position:relative;overflow:hidden;margin:12px 16px 0;border-radius:22px;padding:22px 18px 20px;color:#fff;
  background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 62%,#000));box-shadow:var(--shadow-md)}
.sf-hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 1.4px);background-size:16px 16px;
  mask-image:linear-gradient(to left,#000,transparent 75%);-webkit-mask-image:linear-gradient(to left,#000,transparent 75%)}
.sf-hero-in{position:relative;z-index:1;display:flex;gap:14px;align-items:center}
.sf-logo{width:68px;height:68px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.18);flex:none;display:grid;place-items:center;font-size:28px;font-weight:700;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.sf-logo img{width:100%;height:100%;object-fit:cover;display:block}
.sf-hero h1{margin:0;font-size:22px;font-weight:700;line-height:1.3}
.sf-hero p{margin:3px 0 0;opacity:.88;font-size:14px}
.sf-perks{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sf-perks span,.sf-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;text-decoration:none;white-space:nowrap}
.sf-perks svg,.sf-pill svg{width:15px;height:15px}
a.sf-pill{background:#fff;color:color-mix(in srgb,var(--brand) 85%,#000);font-weight:600}
.sf-wrap{max-width:960px;margin:0 auto}
.sf-search{margin:14px 16px 0;position:relative}
.sf-search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.sf-search input{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;padding-inline-start:40px;box-shadow:var(--shadow-sm)}
.sf-search input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.sf-tabs{position:sticky;top:57px;z-index:4;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 10px;background:var(--bg)}
.sf-tabs::-webkit-scrollbar{display:none}
.sf-tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;white-space:nowrap}
.sf-tabs button span{color:var(--faint);font-size:12px}
.sf-tabs button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sf-tabs button[aria-current="true"] span{color:inherit;opacity:.8}
.sf-sec{padding:6px 16px 8px;scroll-margin-top:112px}
.sf-sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:12px 2px 10px}
.sf-sec-head h2{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sf-sec-head h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--brand)}
.sf-sec-head span{color:var(--muted);font-size:12.5px}
.sf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.sf-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.sf-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sf-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);min-width:0}
.sf-card-hit{border:0;padding:0;background:none;display:block;width:100%}
.sf-card .pic{aspect-ratio:1;display:grid;place-items:center;font-size:40px;font-weight:600;color:#fff;width:100%}
.sf-card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.sf-card-name{border:0;background:none;padding:0;text-align:start;font-weight:500;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.sf-card-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.sf-card-price{font-weight:700;color:var(--accent);font-size:14.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-add{width:36px;height:36px;border-radius:12px;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.sf-add svg{width:20px;height:20px}
.sf-add:active{transform:scale(.94)}

  background:linear-gradient(135deg, var(--brand), color-mix(in srgb,var(--brand) 70%,#000));box-shadow:var(--shadow-md)}

// Resize + re-encode on the phone before saving: smaller files, and it strips hidden metadata (location etc.).
// Every photo is shrunk on the phone before upload: target ≤ 180 KB, never above 200 KB
// (the storage bucket also rejects anything larger). Tries lower quality first, then smaller size.
const IMG_TARGET = 180 * 1024;
const IMG_HARD_MAX = 200 * 1024;
const IMG_QUALITIES = [0.8, 0.7, 0.6, 0.5, 0.42];
async function shrinkToTarget(w0, h0, encode, max = 1200, target = IMG_TARGET, hardMax = IMG_HARD_MAX) {
  let dim = Math.min(max, Math.max(w0, h0));
  let best = null;
  while (dim >= 240) {
    const scale = dim / Math.max(w0, h0);
    const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    for (const q of IMG_QUALITIES) {
      const blob = await encode(w, h, q);
      if (!blob) continue;
      if (!best || blob.size < best.size) best = blob;
      if (blob.size <= target) return blob;
    }
    dim = Math.floor(dim * 0.75);
  }
  return best && best.size <= hardMax ? best : null;
}
async function compressImage(file, max = 1200) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('bad image')); i.src = url; });
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    let webpOk = true;
    const encode = async (w, h, q) => {
      c.width = w; c.height = h;
      ctx.fillStyle = '#ffffff'; // transparent PNGs get a white background instead of black
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      if (webpOk) {
        const b = await new Promise((r) => c.toBlob(r, 'image/webp', q));
        if (b && b.type === 'image/webp') return b;
        webpOk = false; // older iPhones: fall back to JPEG
      }
      return new Promise((r) => c.toBlob(r, 'image/jpeg', q));
    };
    return await shrinkToTarget(img.naturalWidth, img.naturalHeight, encode, max);
  } finally { URL.revokeObjectURL(url); }
}
async function addImages(files, room, max) {

  for (const f of Array.from(files)) {
    if (ids.length >= room) { skipped++; continue; }
    if (!/^image\//.test(f.type) || f.size > 20 * 1024 * 1024) { skipped++; continue; }
    try {
      const st = store();
      if (!st) { skipped++; continue; }
      const blob = await compressImage(f, max);
      if (!blob || blob.size > IMG_HARD_MAX) { skipped++; continue; }
      const id = `${st.id}/${uid()}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
      await imgPut(id, blob);
      ids.push(id);
      sizes.push(blob.size);
    } catch (e) { skipped++; }
  }

// Someone else saved first (another device, or the admin). Keep the parts only this device changed.
async function mergeConflict(s) {
  const { data: r } = await sb.from('stores').select('*').eq('id', s.id).maybeSingle();
  if (!r) { setSync('error'); return; }
  const [baseSlug, base] = JSON.parse(s._synced);
  const local = toData(s);
  const fresh = fromRow(r);
  const remote = toData(fresh);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  let lost = false;
  for (const k of new Set([...Object.keys(local), ...Object.keys(base)])) {
    if (same(local[k], base[k])) continue;              // not changed here
    if (same(remote[k], base[k])) fresh[k] = local[k];  // changed only here: keep it
    else if (k === 'orders') fresh.orders = mergeOrders(base.orders || [], local.orders || [], remote.orders || []);
    else if (k === 'nextNo') continue;
    else if (!same(remote[k], local[k])) lost = true;   // changed in both places: newer save wins
  }
  fresh.nextNo = Math.max(Number(local.nextNo) || 0, Number(remote.nextNo) || 0, ...fresh.orders.map((o) => (Number(o.no) || 0) + 1), 1001);
  if (s.slug !== baseSlug && fresh.slug === baseSlug) fresh.slug = s.slug;
  const i = state.stores.findIndex((x) => x.id === s.id);
  if (i >= 0) state.stores[i] = fresh;
  toast(lost ? 'تغيّرت بيانات متجرك من جهاز آخر في نفس الوقت؛ عُرضت النسخة الأحدث لبعض الأقسام' : 'دُمجت تعديلاتك مع تحديث من جهاز آخر', lost);
  render();

}
// Orders are merged one by one, so a customer order placed from the store page never wipes edits made here.
function mergeOrders(base, local, remote) {
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const B = new Map(base.map((o) => [o.id, o])), L = new Map(local.map((o) => [o.id, o])), R = new Set(remote.map((o) => o.id));
  const out = [];
  for (const o of remote) {
    const b = B.get(o.id), l = L.get(o.id);
    if (b && !l) continue;                      // deleted here
    out.push(b && l && !same(l, b) ? l : o);    // edited here, or untouched
  }
  let next = Math.max(1000, ...out.map((o) => Number(o.no) || 0), ...local.map((o) => Number(o.no) || 0)) + 1;
  for (const o of local) {
    if (B.has(o.id) || R.has(o.id)) continue;
    if (out.some((x) => x.no === o.no)) o.no = next++; // number taken meanwhile by a customer order
    out.push(o);
  }
  return out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

const findVariant = (s, vid) => { for (const p of s.products) { const v = p.variants.find((x) => x.id === vid); if (v) return { p, v }; } return null; };
const orderSubtotal = (o) => o.items.reduce((t, it) => t + it.price * it.qty, 0);
const orderTotal = (o) => Math.max(0, orderSubtotal(o) - (o.discount || 0)) + (o.delivery || 0);
const orderCost = (o) => o.items.reduce((t, it) => t + it.cost * it.qty, 0);
const statusAt = (o, s) => { const h = o.history.find((x) => x.to === s); return h ? h.at : null; };
const totalStock = (p) => p.variants.reduce((t, v) => t + v.stock, 0);

/* ---------------- business rules (mirrors server policy) ---------------- */
function changeStatus(o, to) {
  const s = store();
  if (!can('orders.write')) return fail('لا تملك صلاحية تعديل الطلبات');
  if (!NEXT[o.status].includes(to)) return fail('هذا الانتقال غير مسموح');
  if (to === 'confirmed') {
    // Deduct stock on confirm, all-or-nothing.
    for (const it of o.items) {
      const f = findVariant(s, it.variantId);
      if (!f) return fail(`المنتج "${it.name}" لم يعد موجوداً`);
      if (f.v.stock < it.qty) return fail(`لا يكفي المخزون: ${it.name} (${it.label}) متوفر ${f.v.stock} فقط`);
    }
    for (const it of o.items) {
      findVariant(s, it.variantId).v.stock -= it.qty;
      s.movements.push({ id: uid(), kind: 'sale', variantId: it.variantId, qty: -it.qty, reason: `تأكيد الطلب #${o.no}`, at: Date.now(), by: ROLES[state.role].l });
    }
  }
  if ((to === 'canceled' || to === 'returned') && STOCK_OUT.has(o.status)) {
    for (const it of o.items) {
      const f = findVariant(s, it.variantId);
      if (!f) continue;
      f.v.stock += it.qty;
      s.movements.push({ id: uid(), kind: 'return', variantId: it.variantId, qty: it.qty, reason: `${STATUS[to].l} #${o.no}`, at: Date.now(), by: ROLES[state.role].l });
    }
  }
  o.history.push({ from: o.status, to, at: Date.now(), by: ROLES[state.role].l });
  o.status = to;
  save();
  return true;
}

function createOrder(s, data, source, by) {

    history: [{ to: 'new', at: Date.now(), by }], note: data.note || '',
  };

}

// Delivery fee the store set: one price inside Baghdad, one for the other governorates.
function feeNum(x, d) { const n = Number(x); return x !== '' && x != null && Number.isFinite(n) && n >= 0 ? n : d; }
function deliveryOf(s, city) { return city === 'بغداد' ? feeNum(s.deliveryBaghdad, 5000) : feeNum(s.deliveryOther, 6000); }

function customersOf(s) {
  const map = new Map();
  for (const o of s.orders) {
    const k = normPhone(o.customer.phone);
    let c = map.get(k);
    if (!c) { c = { phone: k, name: o.customer.name, city: o.customer.city, address: o.customer.address, orders: [], spent: 0, last: 0 }; map.set(k, c); }
    c.orders.push(o);
    if (o.createdAt >= c.last) { c.last = o.createdAt; c.name = o.customer.name; c.city = o.customer.city; c.address = o.customer.address; }
    if (o.status === 'delivered') c.spent += orderTotal(o) - o.delivery;
  }
  return Array.from(map.values()).sort((a, b) => b.last - a.last);
}

// Period key: 'YYYY-MM' for a month, or 'year' for the current calendar year.
function inPeriod(ts, key) {
  if (!ts) return false;
  if (key === 'year') return new Date(ts).getFullYear() === new Date().getFullYear();
  return monthKey(ts) === key;
}
function periodLabel(key) { return key === 'year' ? `سنة ${new Date().getFullYear()}` : monthLabel(key); }

// Profit & loss for a period. Sales are recognised when the customer receives the order.
function monthReport(s, key) {
  ensureShape(s);
  const delivered = s.orders.filter((o) => o.status === 'delivered' && inPeriod(statusAt(o, 'delivered'), key));
  const grossSales = delivered.reduce((t, o) => t + orderSubtotal(o), 0);
  const discounts = delivered.reduce((t, o) => t + Math.min(o.discount || 0, orderSubtotal(o)), 0);
  const revenue = grossSales - discounts;
  const cogs = delivered.reduce((t, o) => t + orderCost(o), 0);
  const expenses = s.expenses.filter((e) => inPeriod(e.at, key));
  const exp = expenses.reduce((t, e) => t + e.amount, 0);
  const byCat = new Map();
  for (const e of expenses) byCat.set(e.category, (byCat.get(e.category) || 0) + e.amount);
  const stockMoves = s.movements.filter((m) => (m.kind === 'loss' || m.kind === 'adjust') && inPeriod(m.at, key));
  const stockDiff = stockMoves.reduce((t, m) => t + (m.value || 0), 0);
  const returned = s.orders.filter((o) => o.status === 'returned' && inPeriod(statusAt(o, 'returned'), key));
  const canceled = s.orders.filter((o) => o.status === 'canceled' && inPeriod(statusAt(o, 'canceled'), key));
  const qty = new Map();
  for (const o of delivered) for (const it of o.items) {
    const cur = qty.get(it.productId) || { name: it.name, qty: 0, revenue: 0, profit: 0 };
    cur.qty += it.qty; cur.revenue += it.price * it.qty; cur.profit += (it.price - it.cost) * it.qty; qty.set(it.productId, cur);
  }
  const gross = revenue - cogs;
  const net = gross - exp + stockDiff;
  return {
    delivered, grossSales, discounts, revenue, cogs, gross, exp, byCat: Array.from(byCat.entries()).sort((x, y) => y[1] - x[1]),
    stockDiff, stockMoves, net, expenses, returned, canceled,
    margin: revenue ? Math.round((net / revenue) * 100) : 0,
    top: Array.from(qty.values()).sort((x, y) => y.qty - x.qty).slice(0, 8),
  };
}

// Cash box: what actually came in and went out.
const settleValue = (o) => Math.max(0, orderSubtotal(o) - (o.discount || 0)); // delivery company keeps its fee
function supplierBalance(s, supId) {
  const bought = s.purchases.filter((p) => p.supplierId === supId).reduce((t, p) => t + p.total, 0);
  const paid = s.purchases.filter((p) => p.supplierId === supId).reduce((t, p) => t + p.paid, 0) + s.supplierPayments.filter((p) => p.supplierId === supId).reduce((t, p) => t + p.amount, 0);
  return { bought, paid, owed: bought - paid };
}
function cashLedger(s) {
  ensureShape(s);
  const rows = [];
  const byDay = new Map();
  for (const o of s.orders) if (o.settledAt) {
    const k = startOfDay(o.settledAt);
    const g = byDay.get(k) || { at: o.settledAt, amount: 0, n: 0 };
    g.amount += settleValue(o); g.n++; g.at = Math.max(g.at, o.settledAt); byDay.set(k, g);
  }
  byDay.forEach((g) => rows.push({ at: g.at, amount: g.amount, label: `تحصيل من شركة التوصيل (${g.n} طلب)` }));
  for (const e of s.expenses) rows.push({ at: e.at, amount: -e.amount, label: `مصروف: ${e.category}${e.note ? ' — ' + e.note : ''}` });
  const supName = (id) => (s.suppliers.find((x) => x.id === id) || { name: 'مورد' }).name;
  for (const p of s.purchases) if (p.paid) rows.push({ at: p.at, amount: -p.paid, label: `دفع مشتريات: ${supName(p.supplierId)}` });
  for (const p of s.supplierPayments) rows.push({ at: p.at, amount: -p.amount, label: `تسديد للمورد: ${supName(p.supplierId)}` });
  rows.sort((x, y) => y.at - x.at);
  const balance = s.cashOpening + rows.reduce((t, r) => t + r.amount, 0);
  return { rows, balance };
}

function downloadCSV(name, rows) {
  const cell = (c) => { const v = String(c == null ? '' : c); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function stagnant(s) {
  const since = Date.now() - 30 * DAY;
  const moved = new Set();
  for (const o of s.orders) if (o.createdAt >= since && o.status !== 'canceled') for (const it of o.items) moved.add(it.productId);
  return s.products.filter((p) => p.active && !moved.has(p.id) && totalStock(p) > 0);
}

function authError(e) {
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'البريد أو رقم الهاتف أو كلمة المرور غير صحيحة';
  if (m.includes('already') && m.includes('regist')) return 'هذا الحساب مسجّل مسبقاً، سجّل الدخول بدلاً من ذلك';
  if (m.includes('not confirmed')) return 'لم يُؤكَّد البريد بعد. افتح رسالة التأكيد ثم سجّل الدخول';
  if (m.includes('not authorized') || m.includes('sending') || m.includes('confirmation')) return 'تعذّر إرسال بريد التأكيد. يجب إيقاف «Confirm email» من إعدادات Supabase';
  if (m.includes('rate limit') || m.includes('too many') || m.includes('security purposes')) return 'محاولات كثيرة، انتظر دقيقة ثم حاول';
  if (m.includes('password')) return 'كلمة المرور ضعيفة، استخدم 8 أحرف على الأقل';
  if (m.includes('fetch') || m.includes('network') || m.includes('failed')) return 'لا يوجد اتصال بالإنترنت';
  return 'حدث خطأ: ' + ((e && e.message) || '');
}
async function onAuthSubmit(e) {
  e.preventDefault();
  const errEl = $('#aErr');
  const btn = $('#aSubmit');
  const label = btn.textContent;
  const showErr = (m) => { errEl.textContent = m; errEl.hidden = false; btn.disabled = false; btn.textContent = label; };
  errEl.hidden = true;
  const id = normId($('#aId').value);
  const pw = $('#aPw').value;
  if (authTab === 'register') {
    const name = $('#aName').value.trim();
    const storeName = $('#aStore').value.trim();
    if (!name) return showErr('اكتب اسمك');
    if (!storeName) return showErr('اكتب اسم متجرك');
    if (!id) return showErr('اكتب بريداً صحيحاً أو رقم هاتف من 11 رقماً يبدأ بـ 07');
    if (pw.length < 8) return showErr('كلمة المرور 8 أحرف على الأقل');
    btn.disabled = true; btn.textContent = 'جارِ إنشاء متجرك…';
    const { data, error } = await sb.auth.signUp({ email: idToEmail(id), password: pw, options: { data: { name } } });
    if (error) return showErr(authError(error));
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return showErr('هذا الحساب مسجّل مسبقاً، سجّل الدخول بدلاً من ذلك');
    if (!data.session) {
      try { localStorage.setItem('rawaj-pending-store', storeName); } catch (err) { /* ignore */ }
      return showErr('أُنشئ الحساب. أكّد بريدك من الرسالة التي وصلتك ثم سجّل الدخول');
    }
    try { await loadAccount(data.user); if (!store()) await createStore(storeName); } catch (err) { return showErr('أُنشئ الحساب لكن تعذّر إنشاء المتجر. سجّل الدخول لإكماله'); }
    afterSignIn('products');
    toast(`أُنشئ متجرك ومعه اشتراك احترافي مجاني لمدة ${WELCOME_DAYS} يوماً`);
    return;
  }
  if (!id || !pw) return showErr('اكتب بيانات الدخول');
  btn.disabled = true; btn.textContent = 'جارِ الدخول…';
  const { data, error } = await sb.auth.signInWithPassword({ email: idToEmail(id), password: pw });
  if (error) return showErr(authError(error));
  try { await loadAccount(data.user); } catch (err) { await sb.auth.signOut().catch(() => {}); return showErr('تعذّر تحميل بياناتك، حاول مجدداً'); }
  let pending = null;
  try { pending = localStorage.getItem('rawaj-pending-store'); } catch (err) { /* ignore */ }
  if (pending && !store() && !currentUser().isAdmin) {
    try { await createStore(pending); localStorage.removeItem('rawaj-pending-store'); } catch (err) { /* user can create it from the next screen */ }
  }
  afterSignIn('home');
}
function afterSignIn(view) {
  Object.assign(state, { role: 'owner', view, orderFilter: 'all', q: '', pq: '', cq: '', aq: '', af: 'all', aLimit: 50, accTab: 'pl', whTab: 'stock', whFilter: 'all', wq: '', month: null });
  saveUI();
  render();
  setSync('ok');
  window.scrollTo(0, 0);
}
async function signOut() {
  await syncNow();
  try { await sb.auth.signOut(); } catch (e) { /* ignore */ }
  state = freshState();
  loadUI();
  authTab = 'login';
  renderAuth();
}

function renderAdmin() {
  document.body.classList.remove('signed-out');
  document.body.classList.add('admin-mode');
  $('#adminBanner').classList.remove('on');
  const now = Date.now();
  const mk = monthKey(now);
  const owners = new Map(state.users.filter((u) => u.storeId).map((u) => [u.storeId, u]));
  const all = state.stores;
  let orders = 0, gmv = 0;
  for (const s of all) {
    orders += s.orders.length;
    for (const o of s.orders) if (o.status === 'delivered' && monthKey(statusAt(o, 'delivered')) === mk) gmv += Math.max(0, orderSubtotal(o) - o.discount);
  }
  const suspended = all.filter((s) => statusOf(s) === 'suspended').length;
  const paid = all.filter((s) => isPaid(s) && statusOf(s) === 'active');
  const mrr = paid.reduce((t, s) => t + PLANS[planOf(s)].price, 0);
  const newWeek = all.filter((s) => s.createdAt > now - 7 * DAY).length;

  const f = state.af || 'all';
  const q = (state.aq || '').trim().toLowerCase();
  const filters = {
    all: () => true,
    active: (s) => statusOf(s) === 'active',
    suspended: (s) => statusOf(s) === 'suspended',
    trial: (s) => planOf(s) === 'trial',
    paid: (s) => isPaid(s),
    expired: (s) => planOf(s) === 'expired',
  };
  const labels = { all: 'الكل', active: 'نشط', suspended: 'معلّق', trial: 'تجربة', paid: 'مدفوع', expired: 'منتهي' };
  const counts = {};
  for (const k of Object.keys(filters)) counts[k] = all.filter(filters[k]).length;
  let list = all.filter(filters[f]);
  if (q) list = list.filter((s) => {
    const o = owners.get(s.id);
    return s.name.toLowerCase().includes(q) || s.slug.includes(q) || (o && (o.name.toLowerCase().includes(q) || o.email.includes(q)));
  });
  list = list.slice().sort((a, b) => b.createdAt - a.createdAt);
  const limit = state.aLimit || 50;

  $('#admin').innerHTML = `
  <div class="admin-top"><h1>رواج · لوحة الإدارة</h1><span class="sub" style="color:inherit;opacity:.75">${esc(currentUser().email)}</span>
    <button class="btn" type="button" data-act="admin-refresh">تحديث</button>
    <button class="btn" type="button" data-act="logout">خروج</button></div>
  <div class="admin-wrap">
    <dl class="money" style="margin-top:0">
      <div><dt>المتاجر</dt><dd><span class="num">${all.length}</span> <span class="sub">(+${newWeek} هذا الأسبوع)</span></dd></div>
      <div class="${suspended ? 'neg' : ''}"><dt>معلّقة</dt><dd><span class="num">${suspended}</span></dd></div>
      <div><dt>اشتراكات مدفوعة</dt><dd><span class="num">${paid.length}</span></dd></div>
      <div class="cod"><dt>إيراد الاشتراكات الشهري</dt><dd>${money(mrr)}</dd></div>
      <div><dt>المستخدمون</dt><dd><span class="num">${state.users.length}</span></dd></div>
      <div><dt>كل الطلبات</dt><dd><span class="num">${orders.toLocaleString('en-US')}</span></dd></div>
      <div><dt>مبيعات المتاجر هذا الشهر</dt><dd>${money(gmv)}</dd></div>
      <div><dt>متاجر بلا منتجات</dt><dd><span class="num">${all.filter((s) => !s.products.length).length}</span></dd></div>
    </dl>

    <h2>المتاجر</h2>
    <div class="search">${icon('search')}<input class="input" id="aq" type="search" placeholder="اسم المتجر، الرابط، اسم المالك أو بريده" value="${esc(state.aq || '')}" aria-label="بحث في المتاجر"></div>
    <div class="chips" role="group" aria-label="تصفية المتاجر">
      ${Object.keys(filters).map((k) => `<button class="chip" type="button" data-af="${k}" aria-pressed="${f === k}">${labels[k]}<b class="num">${counts[k]}</b></button>`).join('')}
    </div>
    ${list.length ? `<div class="list">${list.slice(0, limit).map((s) => {
      const o = owners.get(s.id);
      return `<button class="item" type="button" data-astore="${s.id}">
        <div class="thumb" style="background:${s.color}">${s.logo ? `<img data-img="${s.logo}" alt="">` : esc(s.name.trim().charAt(0))}</div>
        <div class="grow"><div class="row" style="gap:6px"><span class="trunc">${esc(s.name)}</span>${planBadge(s)}${statusOf(s) === 'suspended' ? '<span class="st-susp">معلّق</span>' : ''}</div>
          <div class="meta trunc">${o ? esc(o.name) + ' · <span dir="ltr">' + esc(o.email) + '</span>' : 'بلا مالك'}</div></div>
        <div style="text-align:left" class="meta"><div><span class="num">${s.products.length}</span> منتج</div><div><span class="num">${s.orders.length}</span> طلب</div></div>
      </button>`;
    }).join('')}</div>
    ${list.length > limit ? `<button class="btn block" type="button" data-act="admin-more" style="margin-top:10px">عرض المزيد (${list.length - limit} متبقي)</button>` : ''}`
    : '<div class="list"><div class="empty">لا توجد متاجر تطابق البحث.</div></div>'}

    <h2>سجل عمليات الإدارة</h2>
    ${(state.audit || []).length ? `<div class="list">${state.audit.slice(0, 25).map((a) => `<div class="item"><div class="grow"><div>${esc(a.action)}${a.store ? ` — ${esc(a.store)}` : ''}</div>${a.detail ? `<div class="meta">${esc(a.detail)}</div>` : ''}</div><div class="meta">${ago(a.at)}</div></div>`).join('')}</div>`
      : '<div class="list"><div class="empty">لم تُسجَّل أي عملية بعد.</div></div>'}
  </div>`;
}

async function adminUpdate(s, patch, action, detail) {
  const { data: row, error } = await sb.from('stores').update(patch).eq('id', s.id).select('*').single();
  if (error || !row) { toast('تعذّر الحفظ: ' + ((error && error.message) || ''), true); return false; }
  const local = toData(s);
  const fresh = fromRow(row);
  Object.assign(s, fresh);
  // Keep unsaved local business data if the admin was editing the store at the same time.
  if (JSON.stringify([fresh.slug, local]) !== fresh._synced && state.adminAs === s.id) Object.assign(s, local);
  logAdmin(action, s, detail);
  return true;
}
function adminStoreSheet(id) {
  const s = state.stores.find((x) => x.id === id);
  if (!s) return;
  const owner = state.users.find((u) => u.storeId === s.id);
  const mk = monthKey(Date.now());
  const sales = s.orders.filter((o) => o.status === 'delivered' && monthKey(statusAt(o, 'delivered')) === mk).reduce((t, o) => t + Math.max(0, orderSubtotal(o) - o.discount), 0);
  const last = s.orders.reduce((m, o) => Math.max(m, o.createdAt), 0);
  const susp = statusOf(s) === 'suspended';
  openSheet(`${sheetHead(esc(s.name))}
    <dl class="kv">
      <dt>الحالة</dt><dd>${susp ? '<span class="st-susp">معلّق</span>' : 'نشط'}</dd>
      <dt>الخطة</dt><dd>${planBadge(s)} ${s.planEnds && planOf(s) !== 'free' ? `<span class="sub">حتى ${dateText(s.planEnds)}</span>` : ''}</dd>
      <dt>المالك</dt><dd>${owner ? `${esc(owner.name)}<br><span dir="ltr">${esc(owner.email)}</span>` : '—'}</dd>
      <dt>الرابط</dt><dd dir="ltr" style="text-align:right">${esc(publicLink(s))}</dd>
      <dt>أُنشئ</dt><dd>${dateText(s.createdAt)}</dd>
      <dt>المنتجات</dt><dd><span class="num">${s.products.length}</span></dd>
      <dt>الطلبات</dt><dd><span class="num">${s.orders.length}</span>${last ? ` · آخر طلب ${ago(last)}` : ''}</dd>
      <dt>مبيعات الشهر</dt><dd>${money(sales)}</dd>
    </dl>
    <div class="field"><label for="aPlan">تغيير الخطة</label>
      <div class="row"><select class="input grow" id="aPlan">${Object.keys(PLANS).map((k) => `<option value="${k}" ${(s.plan || 'trial') === k ? 'selected' : ''}>${PLANS[k].l}${PLANS[k].price ? ` — ${PLANS[k].price.toLocaleString('en-US')} د.ع شهرياً` : ''}</option>`).join('')}</select>
      <button class="btn primary" type="button" id="aPlanBtn">تطبيق 30 يوماً</button></div>
      <small class="sub">في المرحلة الأولى يُفعَّل الاشتراك يدوياً بعد استلام التحويل.</small></div>
    <div class="actions">
      <button class="btn primary" type="button" id="aEnter">إدارة المتجر</button>
      <button class="btn" type="button" id="aOpen">فتح صفحة المتجر</button>
    </div>
    <div class="actions">
      <button class="btn ${susp ? '' : 'danger'}" type="button" id="aSusp">${susp ? 'إعادة تفعيل المتجر' : 'تعليق المتجر'}</button>
      ${owner ? '<button class="btn" type="button" id="aReset">كلمة مرور مؤقتة للمالك</button>' : ''}
    </div>
    <div class="actions"><button class="btn danger" type="button" id="aDel">حذف المتجر نهائياً</button></div>`,
  (sh) => {
    sh.querySelector('#aPlanBtn').addEventListener('click', async (ev) => {
      const pl = sh.querySelector('#aPlan').value;
      // Renewal adds 30 days after the current end if it hasn't passed yet.
      const ends = pl === 'free' ? null : Math.max(Date.now(), s.planEnds || 0) + 30 * DAY;
      ev.target.disabled = true;
      const ok = await adminUpdate(s, { plan: pl, welcome: false, plan_ends: ends ? new Date(ends).toISOString() : null },
        'تغيير الخطة', `${PLANS[pl].l}${ends ? ' حتى ' + dateText(ends) : ''}`);
      renderAdmin(); adminStoreSheet(id);
      if (ok) toast(`الخطة الآن: ${PLANS[pl].l}`);
    });
    sh.querySelector('#aEnter').addEventListener('click', () => {
      state.adminAs = s.id; state.role = 'owner'; state.view = 'home'; state.orderFilter = 'all'; state.q = ''; state.pq = ''; state.cq = ''; state.month = null;
      logAdmin('دخول لإدارة متجر', s);
      saveUI(); closeSheet(); render(); setSync('ok'); window.scrollTo(0, 0);
    });
    sh.querySelector('#aOpen').addEventListener('click', () => { closeSheet(); openStorefront(s, false); });
    sh.querySelector('#aSusp').addEventListener('click', async () => {
      const ok = await confirmSheet(susp ? 'إعادة تفعيل المتجر' : 'تعليق المتجر',
        susp ? 'سيعود المالك والموظفون للعمل، وتظهر صفحة المتجر للزبائن.' : 'لن يستطيع المالك والموظفون العمل، وتختفي منتجات المتجر من صفحته العامة. لا يُحذف أي شيء.',
        susp ? 'إعادة التفعيل' : 'تعليق', !susp);
      if (!ok) { adminStoreSheet(id); return; }
      const done = await adminUpdate(s, { status: susp ? 'active' : 'suspended' }, susp ? 'إعادة تفعيل متجر' : 'تعليق متجر');
      renderAdmin(); adminStoreSheet(id);
      if (done) toast(susp ? 'أُعيد تفعيل المتجر' : 'عُلّق المتجر');
    });
    const rb = sh.querySelector('#aReset');
    if (rb) rb.addEventListener('click', async () => {
      const ok = await confirmSheet('كلمة مرور مؤقتة', `ستتوقف كلمة المرور الحالية لـ ${owner.name}. أعطه الكلمة المؤقتة ليدخل بها ثم يغيّرها.`, 'إنشاء كلمة مؤقتة', false);
      if (!ok) { adminStoreSheet(id); return; }
      const { data: res, error } = await sb.functions.invoke('admin-actions', { body: { action: 'reset_password', user_id: owner.id } });
      if (error || !res || !res.password) { toast('تعذّر إنشاء كلمة مؤقتة، حاول مجدداً', true); adminStoreSheet(id); return; }
      const pw = res.password;
      logAdmin('كلمة مرور مؤقتة للمالك', s, owner.email);
      renderAdmin();
      openSheet(`${sheetHead('كلمة المرور المؤقتة')}<p>أرسلها للمالك ${esc(owner.name)}. لن تظهر مرة ثانية.</p>
        <div class="temp-pw" id="tmpPw">${esc(pw)}</div>
        <div class="actions"><button class="btn" type="button" id="cpPw">${icon('copy')} نسخ</button><button class="btn primary" type="button" data-act="close-sheet">تم</button></div>`,
      (sh2) => sh2.querySelector('#cpPw').addEventListener('click', async () => toast((await copyText(pw)) ? 'نُسخت' : 'تعذّر النسخ')));
    });
    sh.querySelector('#aDel').addEventListener('click', () => {
      openSheet(`${sheetHead('حذف المتجر نهائياً')}
        <p>سيُحذف متجر <b>${esc(s.name)}</b> وكل منتجاته وطلباته وصوره وحساب مالكه. لا يمكن التراجع.</p>
        <div class="field"><label for="delConfirm">للتأكيد اكتب رابط المتجر: <b dir="ltr">${esc(s.slug)}</b></label><input class="input" id="delConfirm" dir="ltr" autocapitalize="off" spellcheck="false"></div>
        <div class="actions"><button class="btn" type="button" id="delNo">رجوع</button><button class="btn danger" type="button" id="delYes" disabled>حذف نهائي</button></div>`,
      (sh2) => {
        const inp = sh2.querySelector('#delConfirm'), yes = sh2.querySelector('#delYes');
        inp.addEventListener('input', () => { yes.disabled = inp.value.trim() !== s.slug; });
        sh2.querySelector('#delNo').addEventListener('click', () => adminStoreSheet(id));
        yes.addEventListener('click', async () => {
          if (inp.value.trim() !== s.slug) return;
          yes.disabled = true; yes.textContent = 'جارِ الحذف…';
          await imgDelFolder(s.id);
          let err = null;
          if (owner && !owner.isAdmin) {
            // Deleting the account removes its store too (foreign key ON DELETE CASCADE).
            const { data: res, error } = await sb.functions.invoke('admin-actions', { body: { action: 'delete_user', user_id: owner.id } });
            if (error || !res || !res.ok) err = error || new Error('failed');
          } else {
            const { error } = await sb.from('stores').delete().eq('id', s.id);
            err = error;
          }
          if (err) { toast('تعذّر حذف المتجر، حاول مجدداً', true); adminStoreSheet(id); return; }
          state.stores = state.stores.filter((x) => x.id !== s.id);
          state.users = owner && !owner.isAdmin ? state.users.filter((u) => u.id !== owner.id) : state.users;
          logAdmin('حذف متجر', s, owner ? owner.email : '');
          closeSheet(); renderAdmin(); toast('حُذف المتجر');
        });
      });
    });
  });
}

    <div class="url">${esc(publicLink(s))}</div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" type="button" data-act="copy-link">${icon('copy')} نسخ</button>
      <button class="btn" type="button" data-act="share-link">${icon('share')} مشاركة</button>
      <button class="btn" type="button" data-act="open-storefront">فتح المتجر</button>
    </div></section>`;
}
async function shareLink(s) {
  const url = publicLink(s);
  if (navigator.share) {
    try { await navigator.share({ title: s.name, text: s.tagline || s.name, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  toast((await copyText(url)) ? 'نُسخ رابط المتجر، أرسله لزبائنك' : 'تعذّر النسخ', false);
}

function viewHome() {
  const s = store();
  const counts = {};
  for (const k of Object.keys(STATUS)) counts[k] = 0;
  for (const o of s.orders) counts[o.status]++;
  const flow = ['new', 'confirmed', 'preparing', 'shipped', 'delivered'];
  const cod = s.orders.filter((o) => o.status === 'shipped').reduce((t, o) => t + orderTotal(o), 0);
  const today = startOfDay(Date.now());
  const todays = s.orders.filter((o) => o.createdAt >= today).length;
  const rep = monthReport(s, monthKey(Date.now()));
  const low = s.products.filter(isLow);
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d0 = today - i * DAY;
    days.push(s.orders.filter((o) => o.createdAt >= d0 && o.createdAt < d0 + DAY).length);
  }
  const max = Math.max(1, ...days);
  const recent = s.orders.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);

  const now = new Date();
  const who = (currentUser().name || '').trim().split(/\s+/)[0];
  const todaysSales = s.orders.filter((o) => o.createdAt >= today && o.status !== 'canceled').reduce((t, o) => t + Math.max(0, orderSubtotal(o) - (o.discount || 0)), 0);
  let dateStr = '';
  try { dateStr = now.toLocaleDateString('ar-IQ-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { dateStr = dateText(now.getTime()); }
  const quick = [
    can('orders.write') && `<button type="button" data-act="new-order"><span class="qi">${icon('plus')}</span>طلب جديد</button>`,
    can('products.write') && `<button type="button" data-act="new-product"><span class="qi">${icon('products')}</span>منتج جديد</button>`,
    can('warehouse') && `<button type="button" data-act="new-purchase"><span class="qi">${icon('warehouse')}</span>استلام بضاعة</button>`,
    can('reports') && `<button type="button" data-act="new-expense"><span class="qi">${icon('reports')}</span>مصروف</button>`,
    `<button type="button" data-act="share-link"><span class="qi">${icon('share')}</span>رابط متجري</button>`,
  ].filter(Boolean).slice(0, 4);
  return `
  <h1 class="sr-only">${esc(s.name)}</h1>
  <section class="hello" aria-label="ملخص اليوم">
    <div class="hello-greet">${now.getHours() < 12 ? 'صباح الخير' : 'مساء الخير'}${who ? '، ' + esc(who) : ''}</div>
    <div class="hello-date">${esc(dateStr)}</div>
    <div class="hello-stats">
      <div><span>طلبات اليوم</span><b class="num">${todays}</b></div>
      <div><span>مبيعات اليوم</span><b>${money(todaysSales)}</b></div>
      <div><span>تنتظر التأكيد</span><b class="num">${counts.new}</b></div>
    </div>
  </section>
  <div class="quick">${quick.join('')}</div>
  <section class="pipeline" aria-label="مسار الطلبات">
    <div class="pipe-track">
      ${flow.map((k) => `<button class="stop ${counts[k] && k !== 'delivered' ? 'hot' : ''}" type="button" style="--c:${STATUS[k].c}" data-filter="${k}">
        <div class="dot"><span class="num">${counts[k]}</span></div><span>${STATUS[k].l}</span></button>`).join('')}
    </div>
    <div class="pipe-foot">
      <span>ملغى <b class="num">${counts.canceled}</b></span>
      <span>مرتجع <b class="num">${counts.returned}</b></span>
    </div>
  </section>

  <dl class="money">
    <div class="cod"><dt>مبالغ عند شركة التوصيل</dt><dd>${money(cod)}</dd></div>
    <div><dt>بذمّتها وتم التسليم</dt><dd>${money(s.orders.filter((o) => o.status === 'delivered' && !o.settledAt).reduce((t, o) => t + settleValue(o), 0))}</dd></div>
    ${can('reports') ? `<div class="${rep.net < 0 ? 'neg' : ''}"><dt>صافي ربح ${MONTHS[new Date().getMonth()]}</dt><dd>${money(rep.net)}</dd></div>` : `<div><dt>تم التسليم هذا الشهر</dt><dd><span class="num">${rep.delivered.length}</span></dd></div>`}
    <div><dt>منتجات قاربت على النفاد</dt><dd><span class="num">${low.length}</span></dd></div>
  </dl>

  <h2>الطلبات آخر 14 يوماً</h2>
  <div class="panel">
    <div class="bars" role="img" aria-label="عدد الطلبات يومياً لآخر 14 يوماً">
      ${days.map((n, i) => `<div class="${i === 13 ? 'today' : ''}" style="height:${(n / max) * 100}%" title="${n} طلب"></div>`).join('')}
    </div>
    <div class="bars-x"><span>قبل 13 يوماً</span><span>اليوم</span></div>
  </div>

  <div class="spread"><h2>أحدث الطلبات</h2><button class="btn" type="button" data-nav="orders">كل الطلبات</button></div>
  ${orderList(recent)}

  ${low.length ? `<h2>يحتاج إعادة تعبئة</h2><div class="list">${low.map((p) => `
    <button class="item" type="button" data-product="${p.id}">
      ${tile(p, 'thumb')}
      <div class="grow"><div class="trunc">${esc(p.name)}</div>
      <div class="meta">${p.variants.filter((v) => v.stock <= p.low).map((v) => `${esc(v.label)}: <span class="num">${v.stock}</span>`).join(' ، ')}</div></div>
      <span class="tag warn">قليل</span></button>`).join('')}</div>` : ''}
  ${can('orders.write') ? `<button class="btn primary fab" type="button" data-act="new-order">${icon('plus')} طلب جديد</button>` : ''}`;
}

function orderList(orders) {
  if (!orders.length) return `<div class="list"><div class="empty">لا توجد طلبات هنا.${can('orders.write') ? '<br><button class="btn primary" type="button" data-act="new-order">سجّل طلباً</button>' : ''}</div></div>`;
  return `<div class="list">${orders.map((o) => `
    <button class="item" type="button" data-order="${o.id}">
      <span class="ono num">#${o.no}</span>
      <div class="grow"><div class="trunc">${esc(o.customer.name)}</div>
        <div class="meta">${esc(o.customer.city)} · ${ago(o.createdAt)}${o.source === 'storefront' ? ' · من واجهة المتجر' : ''}</div></div>
      <div style="text-align:left"><div>${money(orderTotal(o))}</div>${badge(o.status)}</div>
    </button>`).join('')}</div>`;
}

function viewOrders() {
  const s = store();
  const q = (state.q || '').trim();
  const nq = normPhone(q);
  let list = s.orders.slice().sort((a, b) => b.createdAt - a.createdAt);
  const counts = { all: list.length };
  for (const k of Object.keys(STATUS)) counts[k] = list.filter((o) => o.status === k).length;
  if (state.orderFilter !== 'all') list = list.filter((o) => o.status === state.orderFilter);
  if (q) list = list.filter((o) => String(o.no).includes(q.replace('#', '')) || o.customer.name.includes(q) || (nq.length >= 3 && normPhone(o.customer.phone).includes(nq)));
  const chips = ['all', ...Object.keys(STATUS)];
  return `
  <div class="spread"><h1>الطلبات</h1>${can('orders.write') ? `<button class="btn primary" type="button" data-act="new-order">${icon('plus')} طلب جديد</button>` : ''}</div>
  <div class="search">${icon('search')}<input class="input" id="q" type="search" placeholder="رقم الطلب، اسم الزبون أو الهاتف" value="${esc(state.q || '')}" aria-label="بحث في الطلبات"></div>
  <div class="chips" role="group" aria-label="تصفية حسب الحالة">
    ${chips.map((k) => `<button class="chip" type="button" data-filter="${k}" aria-pressed="${state.orderFilter === k}">${k === 'all' ? 'الكل' : STATUS[k].l}<b class="num">${counts[k]}</b></button>`).join('')}
  </div>
  ${orderList(list.slice(0, 80))}
  ${list.length > 80 ? `<p class="sub">تُعرض أحدث 80 نتيجة. استخدم البحث للوصول لطلب أقدم.</p>` : ''}`;
}

function viewProducts() {
  const s = store();
  const q = (state.pq || '').trim();
  const list = s.products.filter((p) => !q || p.name.includes(q) || p.category.includes(q));
  return `
  <div class="spread"><h1>المنتجات</h1>${can('products.write') ? `<button class="btn primary" type="button" data-act="new-product">${icon('plus')} منتج جديد</button>` : ''}</div>
  <div class="search">${icon('search')}<input class="input" id="pq" type="search" placeholder="اسم المنتج أو التصنيف" value="${esc(q)}" aria-label="بحث في المنتجات"></div>
  ${list.length ? `<div class="pgrid">${list.map((p) => {
    const prices = p.variants.map((v) => v.price);
    const lo = prices.length ? Math.min(...prices) : 0, hi = prices.length ? Math.max(...prices) : 0;
    const stock = totalStock(p);
    return `<button class="pcard ${p.active ? '' : 'off'}" type="button" data-product="${p.id}">
      ${!p.active ? '<span class="pc-flag"><span class="tag">مخفي عن الزبائن</span></span>' : isLow(p) ? '<span class="pc-flag"><span class="tag warn">قارب على النفاد</span></span>' : ''}
      ${tile(p, 'pic')}
      <div class="pc-body">
        <div class="pc-name">${esc(p.name)}</div>
        <div class="pc-row"><b>${lo === hi ? money(lo) : `${money(lo)}+`}</b><span class="qty-pill num ${stock <= 0 ? 'out' : isLow(p) ? 'low' : ''}" title="المخزون">${stock}</span></div>
        <div class="meta">${esc(p.category)} · ${p.variants.length} خيار</div>
      </div>
    </button>`;
  }).join('')}</div>` : `<div class="list"><div class="empty">${q ? 'لا توجد منتجات بهذا الاسم.' : 'لم تضف أي منتج بعد.'}${!q && can('products.write') ? '<br><button class="btn primary" type="button" data-act="new-product" style="margin-top:10px">أضف أول منتج</button>' : ''}</div></div>`}`;
}

function viewCustomers() {
  const s = store();
  const q = (state.cq || '').trim();
  const nq = normPhone(q);
  const list = customersOf(s).filter((c) => !q || c.name.includes(q) || (nq.length >= 3 && c.phone.includes(nq)));
  return `
  <h1>الزبائن</h1>
  <p class="sub" style="margin-top:-8px">يُنشأ ملف الزبون تلقائياً من رقم هاتفه عند أول طلب.</p>
  <div class="search">${icon('search')}<input class="input" id="cq" type="search" placeholder="الاسم أو الهاتف" value="${esc(q)}" aria-label="بحث في الزبائن"></div>
  ${list.length ? `<div class="list">${list.slice(0, 100).map((c) => `
    <button class="item" type="button" data-customer="${esc(c.phone)}">
      <div class="grow"><div class="trunc">${esc(c.name)}</div>
        <div class="meta"><span class="num">${esc(c.phone)}</span> · ${esc(c.city)} · ${c.orders.length} طلب</div></div>
      <div style="text-align:left"><div>${money(c.spent)}</div><div class="meta">${ago(c.last)}</div></div>
    </button>`).join('')}</div>` : `<div class="list"><div class="empty">لا يوجد زبائن بعد.</div></div>`}`;
