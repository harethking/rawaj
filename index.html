<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#f5f7f6; --line:#dde3e0; --line-strong:#c5cdc9;
  --ink:#14211f; --muted:#5d6b67; --faint:#8a9692;
  --brand:#1f6b4f;
  --brand-soft:color-mix(in srgb, var(--brand) 12%, var(--surface));
  --brand-ink:#ffffff;
  --new:#1d4ed8; --confirmed:#7c3aed; --preparing:#b45309; --shipped:#0e7490; --delivered:#15803d; --canceled:#6b7280; --returned:#b91c1c;
  --bad:#b91c1c; --good:#15803d; --warn:#b45309;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --nav-h:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1716; --surface:#172220; --sunk:#121b1a; --line:#26332f; --line-strong:#33433e;
    --ink:#e7eeeb; --muted:#9fb0ab; --faint:#74857f;
    --new:#7aa2ff; --confirmed:#b69bff; --preparing:#f2b25c; --shipped:#5cc8dc; --delivered:#5fd18a; --canceled:#9aa3ad; --returned:#ff8a8a;
    --bad:#ff8a8a; --good:#5fd18a; --warn:#f2b25c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --sunk:#121b1a; --line:#26332f; --line-strong:#33433e;
  --ink:#e7eeeb; --muted:#9fb0ab; --faint:#74857f;
  --new:#7aa2ff; --confirmed:#b69bff; --preparing:#f2b25c; --shipped:#5cc8dc; --delivered:#5fd18a; --canceled:#9aa3ad; --returned:#ff8a8a;
  --bad:#ff8a8a; --good:#5fd18a; --warn:#f2b25c;
  color-scheme: dark;
}
:root{--rw:#1f6b4f;--shadow-sm:0 1px 2px rgba(16,32,28,.06),0 1px 1px rgba(16,32,28,.04);--shadow-md:0 2px 6px rgba(16,32,28,.06),0 10px 24px -12px rgba(16,32,28,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 24px -10px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Readex Pro", system-ui, sans-serif; font-size:15px; line-height:1.55;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}

/* Demo notice */

/* Header */
header.top{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
}
.store-mark{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.store-pick{flex:1;min-width:0}
.store-pick select{border:0;background:none;font-weight:600;font-size:16px;padding:0;max-width:100%;appearance:none;-webkit-appearance:none}
.store-pick small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.role-pick{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 8px;font-size:13px}

/* Layout */
.shell{display:flex;min-height:calc(100vh - 100px)}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + 28px);max-width:860px;margin:0 auto;width:100%}
nav.side{display:none}
nav.bottom{
  position:fixed;bottom:0;inset-inline:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line);display:flex;
}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--brand);font-weight:600}
@media (min-width:920px){
  nav.bottom{display:none}
  nav.side{display:flex;flex-direction:column;gap:2px;width:220px;flex:none;padding:16px 12px;border-inline-start:0;border-inline-end:1px solid var(--line);background:var(--surface);position:sticky;top:59px;height:calc(100vh - 59px)}
  nav.side button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);text-align:start}
  nav.side button svg{width:20px;height:20px}
  nav.side button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
  main{padding:24px 28px 40px}
}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1{font-size:22px;font-weight:600;margin:4px 0 14px;letter-spacing:-.2px}
h2{font-size:16px;font-weight:600;margin:24px 0 10px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Order pipeline — the signature element */
.pipeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px 14px;overflow-x:auto}
.pipe-track{display:grid;grid-template-columns:repeat(5,minmax(64px,1fr));position:relative;min-width:340px}
.pipe-track::before{content:"";position:absolute;top:21px;inset-inline:10%;height:2px;background:var(--line-strong)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.stop .dot{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:17px;position:relative}
.stop.hot .dot{background:var(--c);color:#fff}
.stop span{font-size:12px;color:var(--muted)}
.pipe-foot{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}

/* Money strip */
.money{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:14px}

.money .neg dd{color:var(--bad)}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--sunk)}
.item .meta{font-size:12.5px;color:var(--muted)}
.item svg{width:22px;height:22px;flex:none}
.ono{font-weight:600;color:var(--muted);font-size:13px;min-width:44px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}

/* Chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;margin-inline-start:4px}

/* Inputs & buttons */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.input{min-height:76px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search .input{padding-inline-start:38px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 16px;min-height:42px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:15;border-radius:16px;box-shadow:0 6px 20px color-mix(in srgb,var(--brand) 35%,transparent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:40;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;z-index:41;inset-inline:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));

}

  .sheet{inset-inline:auto;left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:86vh;border-radius:20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .16s, transform .16s}

}

/* Order detail */

/* Order builder lines */
.oline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

/* Products */

/* Report table */

/* Storefront */
.sf{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none}

a.sf-pill{background:#fff;color:color-mix(in srgb,var(--brand) 85%,#000);font-weight:600}

.sf-search input{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;padding-inline-start:40px;box-shadow:var(--shadow-sm)}

.sf-tabs{position:sticky;top:57px;z-index:4;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 10px;background:var(--bg)}
.sf-tabs::-webkit-scrollbar{display:none}
.sf-tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;white-space:nowrap}

.sf-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);min-width:0}

.sf-cartbar{position:fixed;z-index:35;inset-inline:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent)}

  background:linear-gradient(135deg, var(--brand), color-mix(in srgb,var(--brand) 70%,#000));box-shadow:var(--shadow-md)}
.hello::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
  background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 1.4px);background-size:16px 16px;
  mask-image:linear-gradient(to left,#000,transparent 70%);-webkit-mask-image:linear-gradient(to left,#000,transparent 70%)}
.hello-greet{font-size:19px;font-weight:600}
.hello-date{opacity:.8;font-size:13px}
.hello-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.hello-stats div{background:rgba(255,255,255,.13);border-radius:12px;padding:9px 10px}
.hello-stats span{display:block;font-size:12px;opacity:.85}
.hello-stats b{display:block;font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 16px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;font-size:12.5px;color:var(--ink);box-shadow:var(--shadow-sm)}
.quick button:hover{background:var(--sunk)}
.quick svg{width:22px;height:22px;color:var(--brand)}
.quick .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft)}

/* Product cards */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:start;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:transform .12s, box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.pcard .pic{aspect-ratio:4/3;display:grid;place-items:center;font-size:36px;font-weight:600;color:#fff}
.pcard .pc-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.pcard .pc-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pc-row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px}
.pcard .pc-flag{position:absolute;top:8px;inset-inline-start:8px;z-index:1}
.pcard .pc-flag .tag{background:var(--surface);box-shadow:var(--shadow-sm)}
.pcard.off .pic{filter:grayscale(.8);opacity:.6}

.sync-dot{position:absolute;inset-inline-start:-6px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.sync-dot[data-st="saving"]{background:var(--warn);animation:pulse 1s infinite}
.sync-dot[data-st="error"]{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
/* Segmented tabs inside a view */
.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;color:var(--muted);white-space:nowrap;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ledger td.ind{padding-inline-start:18px;color:var(--muted);font-size:13.5px}
.ledger tr.sub-sum td{font-weight:600}
.trend{display:flex;align-items:stretch;gap:8px;height:150px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.trend .up,.trend .down{flex:1;width:100%;display:flex;justify-content:center}
.trend .up{align-items:flex-end;border-bottom:1px solid var(--line-strong)}
.trend .down{align-items:flex-start}
.trend .bar{width:70%;max-width:42px;border-radius:4px 4px 0 0;background:var(--good)}
.trend .down .bar{border-radius:0 0 4px 4px;background:var(--bad)}
.trend .lbl{font-size:11px;color:var(--faint);margin-top:4px;white-space:nowrap}
.qty-pill{min-width:44px;text-align:center;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--sunk)}
.qty-pill.low{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.qty-pill.out{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.cash-big{font-size:26px;font-weight:600;margin:2px 0 0}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.check-row input{width:20px;height:20px;accent-color:var(--brand)}
.sf-price{font-size:20px;font-weight:600;margin:10px 0 4px}
.var-table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
.var-table td{padding:9px 0;border-bottom:1px solid var(--line)}
.var-table td:last-child{text-align:left;font-weight:500}

/* Images */
.thumb,.pic,.store-mark{overflow:hidden}
.thumb img,.pic img,.store-mark img{width:100%;height:100%;object-fit:cover;display:block}
.pimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:8px}
.pimg{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .x{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.pimg .cover{position:absolute;bottom:4px;inset-inline-start:4px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px}
.pimg.first{outline:2px solid var(--brand);outline-offset:-2px}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gal-main{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sunk)}
.gal-main img{width:100%;height:100%;object-fit:cover;display:block}
.gal-thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.gal-thumbs button{width:56px;height:56px;flex:none;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--sunk)}
.gal-thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.gal-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.link-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px}
.link-card .url{direction:ltr;text-align:left;font-size:13.5px;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0 10px;word-break:break-all}


/* Dashboard */
main[data-view="home"]{max-width:1200px}
.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.dash-hi{font-size:21px;font-weight:700;letter-spacing:-.3px}
.dash-link{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 6px;box-shadow:var(--shadow-sm);max-width:100%}
.dash-link-url{font-weight:600;font-size:14px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--brand)}
.dash-link .icon-btn{width:36px;height:36px;border-radius:10px}
.dash-link .icon-btn svg{width:18px;height:18px}
@media (max-width:640px){.dash-link{width:100%}.dash-link-url{flex:1}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow-sm);min-width:0}
.kpi-i{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.kpi-i svg{width:19px;height:19px}
.kpi-l{font-size:13px;color:var(--muted);padding-inline-end:40px}
.kpi-v{font-size:20px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){.kpi-v{font-size:24px}}
.kpi.neg .kpi-v{color:var(--bad)}
.kpi-d{display:block;font-size:12px;color:var(--faint);margin-top:4px}
.kpi-d.up{color:var(--good)}.kpi-d.down{color:var(--bad)}
.alerts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:900px){.alerts{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}}
.alert{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--line);border-inline-start:4px solid var(--c);background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0}
.alert b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.alert span{font-size:12.5px;color:var(--muted)}
.alert.hot{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.alert.hot b{color:var(--c)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:4px}
@media (min-width:1000px){.dash-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.dash-grid > section > h2:first-child,.dash-grid .spread h2{margin-top:6px}
.vbars{display:flex;align-items:stretch;gap:5px;height:170px;margin-top:12px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.vbar i{display:block;width:100%;max-width:34px;background:color-mix(in srgb,var(--brand) 55%,transparent);border-radius:6px 6px 2px 2px}
.vbar.today i{background:var(--brand)}
.vbar-v{font-size:10px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.vbar-x{font-size:10.5px;color:var(--faint);margin-top:5px}
.flow{display:grid;gap:8px}
.flow-row{display:grid;grid-template-columns:86px 1fr 34px;align-items:center;gap:10px;border:0;background:none;padding:2px 0;text-align:start;font-size:13.5px}
.flow-row b{text-align:left;color:var(--c)}
.flow-bar{display:block;height:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.flow-bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}
.gov{display:grid;grid-template-columns:86px 1fr 30px;align-items:center;gap:10px;font-size:13.5px;padding:5px 0}
.gov b{text-align:left}
.rank{width:22px;height:22px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--muted)}
@media (min-width:920px){.fab-home{display:none}}
nav.side{height:calc(100vh - 59px)}


/* Plans & welcome */
.price-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.price-card{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-decoration:none;text-align:start}
.price-card.best{border:2px solid var(--brand);background:var(--brand-soft)}
.pc-tag{position:absolute;top:-10px;inset-inline-start:12px;background:var(--brand);color:var(--brand-ink);font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px}
.pc-name{font-weight:600;font-size:14px}
.pc-price b{font-size:24px;font-weight:700}
.pc-per{font-size:12px;color:var(--muted);margin-bottom:8px;min-height:2.4em}
.price-card .btn{margin-top:auto;font-size:13px;padding:8px 10px;min-height:38px}
@media (max-width:360px){.price-cards{grid-template-columns:1fr}}
.welcome{text-align:center;padding-top:6px}
.welcome-burst{display:inline-block;padding:10px;border-radius:26px;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 18%,transparent),transparent 70%)}
.welcome-burst .rawaj-logo{margin:0 auto}
.welcome h3{font-size:26px;font-weight:700;margin:6px 0 4px}
.welcome-lead{font-size:16px;margin:0 0 10px}
.welcome-days{display:inline-block;background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good);border-radius:999px;padding:5px 14px;font-size:14px}
.welcome-link{display:flex;flex-direction:column;gap:2px;margin:14px auto 0;background:var(--sunk);border-radius:12px;padding:8px 12px;max-width:340px}
.welcome-link b{font-size:16px;color:var(--brand)}
.welcome .price-cards{text-align:start}
.admin-top .rawaj-logo{filter:none}


.feat-intro{display:flex;gap:14px;align-items:flex-start}
.feat-ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.feat-ico svg{width:26px;height:26px}
.feat-steps{margin:12px 0 0;padding-inline-start:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}


.redeem .row .input{letter-spacing:1px;text-align:left}
.invite .url{direction:ltr;text-align:left;font-size:14px;font-weight:600;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0 10px;word-break:break-all;color:var(--brand)}
.ref-progress{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ref-list{display:grid;gap:6px;margin-top:10px}
.ref-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.wa-missing{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:14px;padding:12px 14px;margin-bottom:12px;color:var(--ink)}
.wa-missing svg{width:26px;height:26px;color:var(--warn);flex:none}
.ref-admin .item{align-items:flex-start}
.ref-admin a{word-break:break-all}


.price-card{gap:6px}
.pc-feats{list-style:none;margin:2px 0 8px;padding:0;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.pc-feats li{position:relative;padding-inline-start:16px}
.pc-feats li::before{content:"✓";position:absolute;inset-inline-start:0;color:var(--good);font-weight:700}
.price-card .btn + .btn{margin-top:0}
.tier-chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);margin-inline-start:4px}
.tier-chip.pro{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.limit-bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.limit-bar .btn{min-height:34px;padding:5px 12px;font-size:13px}
.limit-bar .flow-bar{margin-top:8px}
.limit-bar.full{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}


.pro-tag{font-style:normal;font-size:10.5px;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 7px;margin-inline-start:auto;line-height:18px}
nav.side button .pro-tag{margin-inline-start:auto}
nav.bottom .pro-tag{display:none}
.pro-lock{display:flex;gap:14px;align-items:flex-start;border-color:color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft)}
.cp-code{font-weight:700;letter-spacing:1px;background:var(--sunk);border:1px dashed var(--line-strong);border-radius:8px;padding:4px 10px;flex:none}
.coupon-box{margin:-4px 0 12px}
.coupon-box .input{min-height:40px}
.socials-set{border:1px solid var(--line);border-radius:12px;padding:10px 12px 0;margin:0 0 12px}
.socials-set legend{font-size:13.5px;padding:0 6px}
.sf-socials{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sf-soc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25)}
.sf-soc svg{width:14px;height:14px}
.exp-days{font-size:11.5px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.exp-counter{flex:none;width:54px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);line-height:1.1}
.exp-counter b{font-size:20px}
.exp-counter span{font-size:11px}

/* Auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-box{width:100%;max-width:400px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth-brand .store-mark{width:48px;height:48px;border-radius:14px;font-size:22px}
.auth-brand h1{margin:0;font-size:24px}
.auth-brand p{margin:0;color:var(--muted);font-size:13.5px}
.auth{background:linear-gradient(160deg,#fff8e7 0%,#f1fbf6 50%,#e8f7ff 100%)}
.auth-brand h1{color:#1f6b4f}
.auth .btn.primary{background:linear-gradient(135deg,#f59e0b 0%,#1f6b4f 100%);border-color:transparent;color:#ffffff}
.auth .tabs [aria-selected="true"]{color:#1f6b4f;border-bottom-color:#f59e0b}
.confirm-box{border:1px solid #bfe3cf;background:#f1fbf6;text-align:right}
.confirm-box .confirm-title{font-size:18px;font-weight:700;color:#1f6b4f;margin-bottom:8px}
.confirm-box p{margin:0 0 10px;font-size:14px;line-height:1.8;color:var(--ink)}
.confirm-box ol{margin:0 0 12px;padding-inline-start:20px;font-size:14px;line-height:1.9;color:var(--ink)}
.confirm-note{background:#fff8e7;border:1px solid #f5d79a;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.8;color:#7a5200;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:none;border-radius:9px;padding:9px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{margin-top:16px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:12px;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink)}
body.signed-out header.top, body.signed-out .shell, body.signed-out nav.bottom,
body.admin-mode header.top, body.admin-mode .shell, body.admin-mode nav.bottom{display:none}
body:not(.signed-out) #auth{display:none}
body:not(.admin-mode) #admin{display:none}
#adminBanner{display:none;background:var(--confirmed);color:#fff;font-size:13.5px;padding:8px 16px;align-items:center;justify-content:space-between;gap:10px}
#adminBanner.on{display:flex}
#planBanner{display:none;padding:10px 16px;font-size:14px;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#planBanner.on{display:flex}
#planBanner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
#planBanner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
#planBanner .row{gap:6px}
#planBanner .btn{min-height:34px;padding:4px 12px;font-size:13.5px;text-decoration:none}
body.signed-out #planBanner, body.admin-mode #planBanner{display:none}
#adminBanner button{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.admin-top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:12px}
.admin-top h1{margin:0;font-size:18px;flex:1}
.admin-top .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:36px;padding:5px 12px}
.admin-wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
.plan{font-size:11.5px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.plan.paid{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.plan.expired{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.st-susp{color:var(--bad);font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0 0 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.temp-pw{font-size:22px;font-weight:600;letter-spacing:1px;direction:ltr;text-align:center;background:var(--sunk);border-radius:10px;padding:12px;margin:10px 0}

/* Toast */
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);display:none}
.toast.show{display:block}
.toast.bad{background:var(--bad);color:#fff}

/* Print */
#print{display:none}
@media print{
  body > *:not(#print){display:none !important}
  #print{display:block;color:#000;font-family:"Readex Pro",sans-serif;padding:10mm}
  #print table{width:100%;border-collapse:collapse}
  #print td,#print th{border-bottom:1px solid #999;padding:6px 4px;text-align:start}
}
@media (prefers-reduced-motion: reduce){ .sheet{transition:none} }

// Resize + re-encode on the phone before saving: smaller files, and it strips hidden metadata (location etc.).
// Every photo is shrunk on the phone before upload: target ≤ 180 KB, never above 200 KB
// (the storage bucket also rejects anything larger). Tries lower quality first, then smaller size.
const IMG_TARGET = 180 * 1024;
const IMG_HARD_MAX = 200 * 1024;
const IMG_QUALITIES = [0.8, 0.7, 0.6, 0.5, 0.42];
async function shrinkToTarget(w0, h0, encode, max = 1200, target = IMG_TARGET, hardMax = IMG_HARD_MAX) {
  let dim = Math.min(max, Math.max(w0, h0));
  let best = null;
  while (dim >= 240) {
    const scale = dim / Math.max(w0, h0);
    const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    for (const q of IMG_QUALITIES) {
      const blob = await encode(w, h, q);
      if (!blob) continue;
      if (!best || blob.size < best.size) best = blob;
      if (blob.size <= target) return blob;
    }
    dim = Math.floor(dim * 0.75);
  }
  return best && best.size <= hardMax ? best : null;
}
async function compressImage(file, max = 1200) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('bad image')); i.src = url; });
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    let webpOk = true;
    const encode = async (w, h, q) => {
      c.width = w; c.height = h;
      ctx.fillStyle = '#ffffff'; // transparent PNGs get a white background instead of black
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      if (webpOk) {
        const b = await new Promise((r) => c.toBlob(r, 'image/webp', q));
        if (b && b.type === 'image/webp') return b;
        webpOk = false; // older iPhones: fall back to JPEG
      }
      return new Promise((r) => c.toBlob(r, 'image/jpeg', q));
    };
    return await shrinkToTarget(img.naturalWidth, img.naturalHeight, encode, max);
  } finally { URL.revokeObjectURL(url); }
}
async function addImages(files, room, max) {
  const ids = [];
  const sizes = [];
  let skipped = 0;
  for (const f of Array.from(files)) {
    if (ids.length >= room) { skipped++; continue; }
    if (!/^image\//.test(f.type) || f.size > 20 * 1024 * 1024) { skipped++; continue; }
    try {
      const st = store();
      if (!st) { skipped++; continue; }
      const blob = await compressImage(f, max);
      if (!blob || blob.size > IMG_HARD_MAX) { skipped++; continue; }
      const id = `${st.id}/${uid()}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
      await imgPut(id, blob);
      ids.push(id);
      sizes.push(blob.size);
    } catch (e) { skipped++; }
  }
  return { ids, skipped, sizes };
}

const SERVER_KEYS = new Set(['id', 'slug', 'status', 'plan', 'planEnds', 'welcome', 'ownerId', 'createdAt', 'refCode', 'referredBy', 'socialUrl', 'refStatus', 'refRewards', '_version', '_synced']);

// Changes are saved to the server shortly after each edit. `version` prevents two devices overwriting each other.
let syncTimer = null, syncing = false, syncAgain = false;
function save() { saveUI(); clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 600); }
function hasPending() { const s = store(); return !!s && (syncing || fingerprint(s) !== s._synced); }
function setSync(st) {
  const el = document.getElementById('syncDot');
  if (el) { el.dataset.st = st; el.title = { saving: 'جارِ الحفظ…', ok: 'محفوظ', error: 'لم يُحفظ بعد' }[st]; }

async function syncNow() {
  const s = store();
  if (!s) return;
  if (syncing) { syncAgain = true; return; }
  const data = toData(s);
  const json = fingerprint(s);
  if (json === s._synced) return;
  syncing = true;
  setSync('saving');
  try {
    const { data: rows, error } = await sb.from('stores').update({ data, slug: s.slug, version: s._version + 1 }).eq('id', s.id).eq('version', s._version).select('version');
    if (error) throw error;
    if (!rows || !rows.length) { await mergeConflict(s); return; }
    s._version = rows[0].version;
    s._synced = json;
    setSync('ok');
  } catch (e) {
    setSync('error');
    const msg = String((e && (e.message || e.code)) || '');
    if (msg.includes('STORE_SUSPENDED')) { s.status = 'suspended'; render(); return; }
    if (e && e.code === '23505') { toast('اسم الرابط مستخدم من متجر آخر، اختر اسماً غيره', true); await reloadStore(s.id); return; }
    toast('تعذّر الحفظ، تحقق من الإنترنت. سنعيد المحاولة تلقائياً', true);
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 5000);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; syncNow(); }
  }
}
// Someone else saved first (another device, or the admin). Keep the parts only this device changed.
async function mergeConflict(s) {
  const { data: r } = await sb.from('stores').select('*').eq('id', s.id).maybeSingle();
  if (!r) { setSync('error'); return; }
  const [baseSlug, base] = JSON.parse(s._synced);
  const local = toData(s);
  const fresh = fromRow(r);
  const remote = toData(fresh);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  let lost = false;
  for (const k of new Set([...Object.keys(local), ...Object.keys(base)])) {
    if (same(local[k], base[k])) continue;              // not changed here
    if (same(remote[k], base[k])) fresh[k] = local[k];  // changed only here: keep it
    else if (k === 'orders') fresh.orders = mergeOrders(base.orders || [], local.orders || [], remote.orders || []);
    else if (k === 'nextNo') continue;
    else if (k === 'coupons') fresh.coupons = (local.coupons || []).map((c) => { const r = (remote.coupons || []).find((x) => x.code === c.code); return r ? { ...c, used: Math.max(c.used || 0, r.used || 0) } : c; });
    else if (!same(remote[k], local[k])) lost = true;   // changed in both places: newer save wins
  }
  fresh.nextNo = Math.max(Number(local.nextNo) || 0, Number(remote.nextNo) || 0, ...fresh.orders.map((o) => (Number(o.no) || 0) + 1), 1001);
  if (s.slug !== baseSlug && fresh.slug === baseSlug) fresh.slug = s.slug;
  const i = state.stores.findIndex((x) => x.id === s.id);
  if (i >= 0) state.stores[i] = fresh;
  toast(lost ? 'تغيّرت بيانات متجرك من جهاز آخر في نفس الوقت؛ عُرضت النسخة الأحدث لبعض الأقسام' : 'دُمجت تعديلاتك مع تحديث من جهاز آخر', lost);
  render();
  if (fingerprint(fresh) !== fresh._synced) save(); else setSync('ok');
}
// Orders are merged one by one, so a customer order placed from the store page never wipes edits made here.
function mergeOrders(base, local, remote) {
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const B = new Map(base.map((o) => [o.id, o])), L = new Map(local.map((o) => [o.id, o])), R = new Set(remote.map((o) => o.id));
  const out = [];
  for (const o of remote) {
    const b = B.get(o.id), l = L.get(o.id);
    if (b && !l) continue;                      // deleted here
    out.push(b && l && !same(l, b) ? l : o);    // edited here, or untouched
  }
  let next = Math.max(1000, ...out.map((o) => Number(o.no) || 0), ...local.map((o) => Number(o.no) || 0)) + 1;
  for (const o of local) {
    if (B.has(o.id) || R.has(o.id)) continue;
    if (out.some((x) => x.no === o.no)) o.no = next++; // number taken meanwhile by a customer order
    out.push(o);
  }
  return out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}
// New customer orders arrive on the server; pick them up while the owner has the app open.

async function createStore(name) {

    const slug = await uniqueSlug(name);
    const data = emptyStore(name);
    if (validPhone(me.email)) data.phone = normPhone(me.email); // registered with a phone: orders go to that WhatsApp
    const { data: row, error } = await sb.from('stores').insert({ owner_id: me.id, slug, data }).select('*').single();

// A signed-in user only ever sees the store tied to their account.
// The platform admin has no store of their own; they open one explicitly from the admin panel.
const store = () => {
  const u = currentUser();
  if (!u) return null;
  if (u.isAdmin) return state.adminAs ? state.stores.find((s) => s.id === state.adminAs) || null : null;
  return state.stores.find((s) => s.id === u.storeId) || null;
};
const can = (perm) => ROLES[state.role].p.includes(perm);
const findVariant = (s, vid) => { for (const p of s.products) { const v = p.variants.find((x) => x.id === vid); if (v) return { p, v }; } return null; };
const orderSubtotal = (o) => o.items.reduce((t, it) => t + it.price * it.qty, 0);
const orderTotal = (o) => Math.max(0, orderSubtotal(o) - (o.discount || 0)) + (o.delivery || 0);
const orderCost = (o) => o.items.reduce((t, it) => t + it.cost * it.qty, 0);
const statusAt = (o, s) => { const h = o.history.find((x) => x.to === s); return h ? h.at : null; };
const totalStock = (p) => p.variants.reduce((t, v) => t + v.stock, 0);
const isLow = (p) => p.active && p.variants.some((v) => v.stock <= p.low);

/* ---------------- business rules (mirrors server policy) ---------------- */
function changeStatus(o, to) {
  const s = store();
  if (!can('orders.write')) return fail('لا تملك صلاحية تعديل الطلبات');
  if (!NEXT[o.status].includes(to)) return fail('هذا الانتقال غير مسموح');
  if (to === 'confirmed') {
    // Deduct stock on confirm, all-or-nothing.
    for (const it of o.items) {
      const f = findVariant(s, it.variantId);
      if (!f) return fail(`المنتج "${it.name}" لم يعد موجوداً`);
      if (f.v.stock < it.qty) return fail(`لا يكفي المخزون: ${it.name} (${it.label}) متوفر ${f.v.stock} فقط`);
    }
    for (const it of o.items) {
      findVariant(s, it.variantId).v.stock -= it.qty;
      s.movements.push({ id: uid(), kind: 'sale', variantId: it.variantId, qty: -it.qty, reason: `تأكيد الطلب #${o.no}`, at: Date.now(), by: ROLES[state.role].l });
    }
  }
  if ((to === 'canceled' || to === 'returned') && STOCK_OUT.has(o.status)) {
    for (const it of o.items) {
      const f = findVariant(s, it.variantId);
      if (!f) continue;
      f.v.stock += it.qty;
      s.movements.push({ id: uid(), kind: 'return', variantId: it.variantId, qty: it.qty, reason: `${STATUS[to].l} #${o.no}`, at: Date.now(), by: ROLES[state.role].l });
    }
  }
  o.history.push({ from: o.status, to, at: Date.now(), by: ROLES[state.role].l });

}

// Delivery fee the store set: one price inside Baghdad, one for the other governorates.
function feeNum(x, d) { const n = Number(x); return x !== '' && x != null && Number.isFinite(n) && n >= 0 ? n : d; }
function deliveryOf(s, city) { return city === 'بغداد' ? feeNum(s.deliveryBaghdad, 5000) : feeNum(s.deliveryOther, 6000); }

function customersOf(s) {
  const map = new Map();
  for (const o of s.orders) {
    const k = normPhone(o.customer.phone);
    let c = map.get(k);
    if (!c) { c = { phone: k, name: o.customer.name, city: o.customer.city, address: o.customer.address, orders: [], spent: 0, last: 0 }; map.set(k, c); }
    c.orders.push(o);
    if (o.createdAt >= c.last) { c.last = o.createdAt; c.name = o.customer.name; c.city = o.customer.city; c.address = o.customer.address; }
    if (o.status === 'delivered') c.spent += orderTotal(o) - o.delivery;
  }
  return Array.from(map.values()).sort((a, b) => b.last - a.last);
}

// Period key: 'YYYY-MM' for a month, or 'year' for the current calendar year.
function inPeriod(ts, key) {
  if (!ts) return false;
  if (key === 'year') return new Date(ts).getFullYear() === new Date().getFullYear();
  return monthKey(ts) === key;
}
function periodLabel(key) { return key === 'year' ? `سنة ${new Date().getFullYear()}` : monthLabel(key); }

// Profit & loss for a period. Sales are recognised when the customer receives the order.
function monthReport(s, key) {
  ensureShape(s);
  const delivered = s.orders.filter((o) => o.status === 'delivered' && inPeriod(statusAt(o, 'delivered'), key));
  const grossSales = delivered.reduce((t, o) => t + orderSubtotal(o), 0);
  const discounts = delivered.reduce((t, o) => t + Math.min(o.discount || 0, orderSubtotal(o)), 0);
  const revenue = grossSales - discounts;
  const cogs = delivered.reduce((t, o) => t + orderCost(o), 0);
  const expenses = s.expenses.filter((e) => inPeriod(e.at, key));
  const exp = expenses.reduce((t, e) => t + e.amount, 0);
  const byCat = new Map();
  for (const e of expenses) byCat.set(e.category, (byCat.get(e.category) || 0) + e.amount);
  const stockMoves = s.movements.filter((m) => (m.kind === 'loss' || m.kind === 'adjust') && inPeriod(m.at, key));
  const stockDiff = stockMoves.reduce((t, m) => t + (m.value || 0), 0);
  const returned = s.orders.filter((o) => o.status === 'returned' && inPeriod(statusAt(o, 'returned'), key));
  const canceled = s.orders.filter((o) => o.status === 'canceled' && inPeriod(statusAt(o, 'canceled'), key));
  const qty = new Map();
  for (const o of delivered) for (const it of o.items) {
    const cur = qty.get(it.productId) || { name: it.name, qty: 0, revenue: 0, profit: 0 };
    cur.qty += it.qty; cur.revenue += it.price * it.qty; cur.profit += (it.price - it.cost) * it.qty; qty.set(it.productId, cur);
  }
  const gross = revenue - cogs;
  const net = gross - exp + stockDiff;
  return {
    delivered, grossSales, discounts, revenue, cogs, gross, exp, byCat: Array.from(byCat.entries()).sort((x, y) => y[1] - x[1]),
    stockDiff, stockMoves, net, expenses, returned, canceled,
    margin: revenue ? Math.round((net / revenue) * 100) : 0,
    top: Array.from(qty.values()).sort((x, y) => y.qty - x.qty).slice(0, 8),
  };
}

// Cash box: what actually came in and went out.
const settleValue = (o) => Math.max(0, orderSubtotal(o) - (o.discount || 0)); // delivery company keeps its fee
function supplierBalance(s, supId) {
  const bought = s.purchases.filter((p) => p.supplierId === supId).reduce((t, p) => t + p.total, 0);
  const paid = s.purchases.filter((p) => p.supplierId === supId).reduce((t, p) => t + p.paid, 0) + s.supplierPayments.filter((p) => p.supplierId === supId).reduce((t, p) => t + p.amount, 0);
  return { bought, paid, owed: bought - paid };
}
function cashLedger(s) {
  ensureShape(s);
  const rows = [];
  const byDay = new Map();
  for (const o of s.orders) if (o.settledAt) {
    const k = startOfDay(o.settledAt);
    const g = byDay.get(k) || { at: o.settledAt, amount: 0, n: 0 };
    g.amount += settleValue(o); g.n++; g.at = Math.max(g.at, o.settledAt); byDay.set(k, g);
  }
  byDay.forEach((g) => rows.push({ at: g.at, amount: g.amount, label: `تحصيل من شركة التوصيل (${g.n} طلب)` }));
  for (const e of s.expenses) rows.push({ at: e.at, amount: -e.amount, label: `مصروف: ${e.category}${e.note ? ' — ' + e.note : ''}` });
  const supName = (id) => (s.suppliers.find((x) => x.id === id) || { name: 'مورد' }).name;
  for (const p of s.purchases) if (p.paid) rows.push({ at: p.at, amount: -p.paid, label: `دفع مشتريات: ${supName(p.supplierId)}` });
  for (const p of s.supplierPayments) rows.push({ at: p.at, amount: -p.amount, label: `تسديد للمورد: ${supName(p.supplierId)}` });
  rows.sort((x, y) => y.at - x.at);
  const balance = s.cashOpening + rows.reduce((t, r) => t + r.amount, 0);
  return { rows, balance };
}

function downloadCSV(name, rows) {
  const cell = (c) => { let v = String(c == null ? '' : c); if (typeof c === 'string' && /^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function stagnant(s) {
  const since = Date.now() - 30 * DAY;
  const moved = new Set();
  for (const o of s.orders) if (o.createdAt >= since && o.status !== 'canceled') for (const it of o.items) moved.add(it.productId);
  return s.products.filter((p) => p.active && !moved.has(p.id) && totalStock(p) > 0);
}

  if (pw !== pw2) return showErr('كلمتا المرور غير متطابقتين');
  btn.disabled = true; btn.textContent = 'جارِ الحفظ…';
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) return showErr(authError(error));
  await sb.auth.signOut().catch(() => {});
  try { history.replaceState(null, '', location.pathname); } catch (err) { /* ignore */ }
  authTab = 'login';
  renderAuth();
  toast('تم تغيير كلمة المرور. سجّل الدخول بالكلمة الجديدة');
}
function authError(e) {
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'البريد أو رقم الهاتف أو كلمة المرور غير صحيحة';
  if (m.includes('already') && m.includes('regist')) return 'هذا الحساب مسجّل مسبقاً، سجّل الدخول بدلاً من ذلك';
  if (m.includes('not confirmed')) return 'لم يُؤكَّد البريد بعد. افتح رسالة التأكيد ثم سجّل الدخول';
  if (m.includes('not authorized') || m.includes('sending') || m.includes('confirmation')) return 'تعذّر إرسال بريد التأكيد. يجب إيقاف «Confirm email» من إعدادات Supabase';
  if (m.includes('rate limit') || m.includes('too many') || m.includes('security purposes')) return 'محاولات كثيرة، انتظر دقيقة ثم حاول';
  if (m.includes('password')) return 'كلمة المرور ضعيفة، استخدم 8 أحرف على الأقل';
  if (m.includes('fetch') || m.includes('network') || m.includes('failed')) return 'لا يوجد اتصال بالإنترنت';
  return 'حدث خطأ: ' + ((e && e.message) || '');
}

async function adminUpdate(s, patch, action, detail) {
  const { data: row, error } = await sb.from('stores').update(patch).eq('id', s.id).select('*').single();
  if (error || !row) { toast('تعذّر الحفظ: ' + ((error && error.message) || ''), true); return false; }
  const local = toData(s);

  // Keep unsaved local business data if the admin was editing the store at the same time.
  if (JSON.stringify([fresh.slug, local]) !== fresh._synced && state.adminAs === s.id) Object.assign(s, local);
  logAdmin(action, s, detail);
  return true;
}

function downloadCodes(list, name) {
  const lbl = { 1: 'شهر', 6: '6 أشهر', 12: 'سنة' };
  const csv = '\ufeffالرمز,النسخة,المدة,الحالة\n' + list.map((c) => `${c.code},${TIER_NAME[c.tier || 'basic']},${lbl[c.months]},${c.redeemed_at ? 'مستخدم' : 'غير مستخدم'}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

const SOCIALS = [
  { k: 'instagram', l: 'انستغرام', base: 'https://instagram.com/', re: /^(www\.|m\.)?instagram\.com\// },
  { k: 'facebook', l: 'فيسبوك', base: 'https://facebook.com/', re: /^(www\.|m\.|web\.)?(facebook\.com|fb\.com)\// },
  { k: 'tiktok', l: 'تيك توك', base: 'https://tiktok.com/@', re: /^(www\.|m\.)?tiktok\.com\// },
  { k: 'telegram', l: 'تيليغرام', base: 'https://t.me/', re: /^t\.me\// },
  { k: 'snapchat', l: 'سناب شات', base: 'https://snapchat.com/add/', re: /^(www\.)?snapchat\.com\// },
  { k: 'youtube', l: 'يوتيوب', base: 'https://youtube.com/@', re: /^(www\.|m\.)?(youtube\.com|youtu\.be)\// },
];
// A username or a full link becomes a clean https link to that platform; anything else is rejected.
function socialLink(k, input) {
  const sp = SOCIALS.find((x) => x.k === k);
  let v = String(input || '').trim();
  if (!v) return '';
  if (/^https?:\/\//i.test(v) || sp.re.test(v.replace(/^https?:\/\//i, ''))) {
    v = v.replace(/^https?:\/\//i, '');
    if (!sp.re.test(v) || /[\s<>"']/.test(v) || v.length > 180) return null;
    return 'https://' + v.replace(/\/+$/, '');
  }
  v = v.replace(/^@/, '');
  if (!/^[A-Za-z0-9._-]{2,60}$/.test(v)) return null;
  return sp.base + v;
}

  const now = Date.now();

    <button type="button" class="alert" data-nav="reports" style="--c:var(--good)"><b>${money(owed)}</b><span>تم التسليم ولم يُستلم</span></button>

  ${quick.length ? `<div class="quick">${quick.join('')}</div>` : ''}

  <div class="dash-grid">
    <section class="panel dash-chart" aria-label="المبيعات آخر 14 يوماً">
      <div class="spread"><div><h2 style="margin:0">المبيعات آخر 14 يوماً</h2><span class="sub">الأرقام بالألف دينار</span></div><b>${money(sum14)}</b></div>
      <div class="vbars" role="img" aria-label="قيمة الطلبات يومياً لآخر 14 يوماً">
        ${days.map((x, i) => `<div class="vbar ${i === 13 ? 'today' : ''}" title="${dateText(x.at)}: ${x.n} طلب، ${moneyText(x.v)}"><span class="vbar-v">${x.v ? fmtK(x.v) : ''}</span><i style="height:${Math.max(2, (x.v / maxV) * 100)}%"></i><span class="vbar-x num">${new Date(x.at).getDate()}</span></div>`).join('')}
      </div>
    </section>

    <section class="panel" aria-label="مسار الطلبات">
      <h2 style="margin:0 0 12px">مسار الطلبات</h2>
      <div class="flow">${flow.map((k) => `<button type="button" class="flow-row" data-filter="${esc(k)}" style="--c:${STATUS[k].c}">
        <span class="flow-l">${STATUS[k].l}</span><span class="flow-bar"><i style="width:${s.orders.length ? Math.max(counts[k] ? 4 : 0, (counts[k] / s.orders.length) * 100) : 0}%"></i></span><b class="num">${counts[k]}</b></button>`).join('')}</div>
      <div class="pipe-foot"><span>ملغى <b class="num">${counts.canceled}</b></span><span>مرتجع <b class="num">${counts.returned}</b></span><span>الكل <b class="num">${s.orders.length}</b></span></div>
    </section>

    <section class="dash-recent">
      <div class="spread"><h2>أحدث الطلبات</h2><button class="btn" type="button" data-nav="orders">كل الطلبات</button></div>
      ${orderList(recent)}
    </section>

    <section>
      <h2>الأكثر طلباً هذا الشهر</h2>
      ${top.length ? `<div class="list">${top.map((t, i) => `<button class="item" type="button" ${s.products.some((x) => x.id === t.id) ? `data-product="${esc(t.id)}"` : ''}>
        <span class="rank num">${i + 1}</span>${tile(pName(t.id, t.name), 'thumb')}
        <div class="grow"><div class="trunc">${esc(t.name)}</div><div class="meta"><span class="num">${t.qty}</span> قطعة</div></div><div>${money(t.v)}</div></button>`).join('')}</div>`
        : '<div class="list"><div class="empty">لا توجد طلبات هذا الشهر بعد.</div></div>'}
      ${gov.length ? `<h2>الطلبات حسب المحافظة</h2><div class="panel">${gov.map(([c, n]) => `<div class="gov"><span>${esc(c)}</span><span class="flow-bar"><i style="width:${(n / gov[0][1]) * 100}%"></i></span><b class="num">${n}</b></div>`).join('')}</div>` : ''}
      ${low.length ? `<h2>يحتاج إعادة تعبئة</h2><div class="list">${low.slice(0, 6).map((p) => `
        <button class="item" type="button" data-product="${esc(p.id)}">${tile(p, 'thumb')}
          <div class="grow"><div class="trunc">${esc(p.name)}</div>
          <div class="meta">${p.variants.filter((v) => v.stock <= p.low).map((v) => `${esc(v.label || 'المخزون')}: <span class="num">${v.stock}</span>`).join(' ، ')}</div></div>
          <span class="tag warn">قليل</span></button>`).join('')}</div>` : ''}
    </section>
  </div>
  ${can('orders.write') ? `<button class="btn primary fab fab-home" type="button" data-act="new-order">${icon('plus')} طلب جديد</button>` : ''}`;
}

function orderList(orders) {
  if (!orders.length) return `<div class="list"><div class="empty">لا توجد طلبات هنا.${can('orders.write') ? '<br><button class="btn primary" type="button" data-act="new-order">سجّل طلباً</button>' : ''}</div></div>`;
  return `<div class="list">${orders.map((o) => `
    <button class="item" type="button" data-order="${esc(o.id)}">
      <span class="ono num">#${o.no}</span>
      <div class="grow"><div class="trunc">${esc(o.customer.name)}</div>
        <div class="meta">${esc(o.customer.city)} · ${ago(o.createdAt)}${o.source === 'storefront' ? ' · من واجهة المتجر' : ''}</div></div>
      <div style="text-align:left"><div>${money(orderTotal(o))}</div>${badge(o.status)}</div>
    </button>`).join('')}</div>`;
}

function viewOrders() {
  const s = store();
  const q = (state.q || '').trim();
  const nq = normPhone(q);
  let list = s.orders.slice().sort((a, b) => b.createdAt - a.createdAt);
  const counts = { all: list.length };
  for (const k of Object.keys(STATUS)) counts[k] = list.filter((o) => o.status === k).length;
  if (state.orderFilter !== 'all') list = list.filter((o) => o.status === state.orderFilter);
  if (q) list = list.filter((o) => String(o.no).includes(q.replace('#', '')) || o.customer.name.includes(q) || (nq.length >= 3 && normPhone(o.customer.phone).includes(nq)));
  const chips = ['all', ...Object.keys(STATUS)];
  return `
  <div class="spread"><h1>الطلبات</h1>${can('orders.write') ? `<button class="btn primary" type="button" data-act="new-order">${icon('plus')} طلب جديد</button>` : ''}</div>
  <div class="search">${icon('search')}<input class="input" id="q" type="search" placeholder="رقم الطلب، اسم الزبون أو الهاتف" value="${esc(state.q || '')}" aria-label="بحث في الطلبات"></div>
  <div class="chips" role="group" aria-label="تصفية حسب الحالة">
    ${chips.map((k) => `<button class="chip" type="button" data-filter="${esc(k)}" aria-pressed="${state.orderFilter === k}">${k === 'all' ? 'الكل' : STATUS[k].l}<b class="num">${counts[k]}</b></button>`).join('')}
  </div>
  ${orderList(list.slice(0, 80))}
  ${list.length > 80 ? `<p class="sub">تُعرض أحدث 80 نتيجة. استخدم البحث للوصول لطلب أقدم.</p>` : ''}`;
}

function viewProducts() {
  const s = store();
  const q = (state.pq || '').trim();
  const list = s.products.filter((p) => !q || p.name.includes(q) || p.category.includes(q));
  return `
  <div class="spread"><h1>المنتجات</h1>${can('products.write') ? `<button class="btn primary" type="button" data-act="new-product">${icon('plus')} منتج جديد</button>` : ''}</div>
  ${isPro(s) ? '' : (() => { const n = s.products.filter((x) => x.active).length; return `<div class="limit-bar ${n >= BASIC_LIMIT ? 'full' : ''}"><div class="spread"><span>نسخة عادي: <b class="num">${Math.min(n, BASIC_LIMIT)}</b> / <span class="num">${BASIC_LIMIT}</span> منتجات منشورة</span><button class="btn" type="button" data-nav="settings">رقِّ لبرو</button></div><div class="flow-bar"><i style="width:${Math.min(100, (n / BASIC_LIMIT) * 100)}%;--c:${n >= BASIC_LIMIT ? 'var(--warn)' : 'var(--brand)'}"></i></div>${n > BASIC_LIMIT ? `<div class="sub" style="margin-top:6px">يظهر للزبائن أول ${BASIC_LIMIT} منتجات فقط.</div>` : ''}</div>`; })()}
  <div class="search">${icon('search')}<input class="input" id="pq" type="search" placeholder="اسم المنتج أو التصنيف" value="${esc(q)}" aria-label="بحث في المنتجات"></div>
  ${list.length ? `<div class="pgrid">${list.map((p) => {
    const prices = p.variants.map((v) => v.price);
    const lo = prices.length ? Math.min(...prices) : 0, hi = prices.length ? Math.max(...prices) : 0;
    const stock = totalStock(p);
    return `<button class="pcard ${p.active ? '' : 'off'}" type="button" data-product="${esc(p.id)}">
      ${!p.active ? '<span class="pc-flag"><span class="tag">مخفي عن الزبائن</span></span>' : isLow(p) ? '<span class="pc-flag"><span class="tag warn">قارب على النفاد</span></span>' : ''}
      ${tile(p, 'pic')}
      <div class="pc-body">
        <div class="pc-name">${esc(p.name)}</div>
        <div class="pc-row"><b>${lo === hi ? money(lo) : `${money(lo)}+`}</b><span class="qty-pill num ${stock <= 0 ? 'out' : isLow(p) ? 'low' : ''}" title="المخزون">${stock}</span></div>
        <div class="meta">${esc(p.category)} · ${p.variants.length} خيار</div>
      </div>
    </button>`;
  }).join('')}</div>` : `<div class="list"><div class="empty">${q ? 'لا توجد منتجات بهذا الاسم.' : 'لم تضف أي منتج بعد.'}${!q && can('products.write') ? '<br><button class="btn primary" type="button" data-act="new-product" style="margin-top:10px">أضف أول منتج</button>' : ''}</div></div>`}`;
}

function viewCustomers() {
  const s = store();
  const q = (state.cq || '').trim();
  const nq = normPhone(q);
  const list = customersOf(s).filter((c) => !q || c.name.includes(q) || (nq.length >= 3 && c.phone.includes(nq)));
  return `
  <h1>الزبائن</h1>
  <p class="sub" style="margin-top:-8px">يُنشأ ملف الزبون تلقائياً من رقم هاتفه عند أول طلب.</p>
  <div class="search">${icon('search')}<input class="input" id="cq" type="search" placeholder="الاسم أو الهاتف" value="${esc(q)}" aria-label="بحث في الزبائن"></div>
  ${list.length ? `<div class="list">${list.slice(0, 100).map((c) => `
    <button class="item" type="button" data-customer="${esc(c.phone)}">
      <div class="grow"><div class="trunc">${esc(c.name)}</div>
        <div class="meta"><span class="num">${esc(c.phone)}</span> · ${esc(c.city)} · ${c.orders.length} طلب</div></div>
      <div style="text-align:left"><div>${money(c.spent)}</div><div class="meta">${ago(c.last)}</div></div>
    </button>`).join('')}</div>` : `<div class="list"><div class="empty">لا يوجد زبائن بعد.</div></div>`}`;

function periodKeys() {
  const keys = [];
  const d = new Date();
  for (let i = 0; i < 6; i++) keys.push(monthKey(new Date(d.getFullYear(), d.getMonth() - i, 15).getTime()));
  keys.push('year');
  return keys;
}
function periodSelect(key) {
  return `<select class="input" id="monthSel" style="width:auto" aria-label="الفترة">${periodKeys().map((k) => `<option value="${k}" ${k === key ? 'selected' : ''}>${periodLabel(k)}</option>`).join('')}</select>`;
}
function segTabs(group, current, tabs) {
  return `<div class="seg" role="group">${tabs.map(([k, l]) => `<button type="button" data-${group}="${k}" aria-pressed="${current === k}">${l}</button>`).join('')}</div>`;
}

function viewReports() {
  const s = store();
  const keys = periodKeys();
  const key = state.month && keys.includes(state.month) ? state.month : keys[0];
  const tab = state.accTab || 'pl';
  const head = `<div class="spread"><h1>الحسابات</h1>${tab === 'cash' ? '' : periodSelect(key)}</div>
    ${segTabs('acctab', tab, [['pl', 'الأرباح والخسائر'], ['cash', 'الصندوق'], ['expenses', 'المصروفات'], ['insights', 'المنتجات']])}`;
  if (tab === 'cash') return head + accCash(s);
  if (tab === 'expenses') return head + accExpenses(s, key);
  if (tab === 'insights') return head + accInsights(s, key);
  return head + accPL(s, key);
}

function accPL(s, key) {
  const r = monthReport(s, key);
  const loss = r.net < 0;
  // six-month trend of net result
  const d = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) { const k = monthKey(new Date(d.getFullYear(), d.getMonth() - i, 15).getTime()); months.push({ k, net: monthReport(s, k).net }); }
  const max = Math.max(1, ...months.map((m) => Math.abs(m.net)));
  return `
  <div class="panel">
    <table class="ledger">
      <tr><td>المبيعات <span class="sub">(${r.delivered.length} طلب مُسلَّم)</span></td><td>${money(r.grossSales)}</td></tr>
      <tr class="minus"><td>الخصومات</td><td>${money(r.discounts)}</td></tr>
      <tr class="sub-sum"><td>صافي المبيعات</td><td>${money(r.revenue)}</td></tr>
      <tr class="minus"><td>تكلفة البضاعة المباعة</td><td>${money(r.cogs)}</td></tr>
      <tr class="sub-sum"><td>مجمل الربح</td><td>${money(r.gross)}</td></tr>
      <tr class="minus"><td>المصروفات</td><td>${money(r.exp)}</td></tr>
      ${r.byCat.map(([c, v]) => `<tr><td class="ind">${esc(c)}</td><td class="ind" style="text-align:left">${money(v)}</td></tr>`).join('')}
      <tr><td>${r.stockDiff < 0 ? '− ' : ''}تلف وفروقات المخزون</td><td style="color:${r.stockDiff < 0 ? 'var(--bad)' : 'inherit'}">${money(Math.abs(r.stockDiff))}</td></tr>
      <tr class="sum"><td>${loss ? 'صافي الخسارة' : 'صافي الربح'}</td><td style="color:${loss ? 'var(--bad)' : 'var(--good)'}">${money(Math.abs(r.net))}</td></tr>
    </table>
    <p class="note">نسبة صافي الربح من المبيعات: <span class="num">${r.margin}%</span>. المبيعات تُحسب عند تسليم الطلب للزبون، من دون أجرة التوصيل لأنها لشركة التوصيل.
    في ${periodLabel(key)}: <span class="num">${r.returned.length}</span> مرتجع و<span class="num">${r.canceled.length}</span> ملغى.</p>
    <div class="row" style="flex-wrap:wrap;margin-top:6px">
      <button class="btn" type="button" data-act="export-pl">${icon('download')} تصدير الأرباح والخسائر</button>
      <button class="btn" type="button" data-act="export-orders">${icon('download')} تصدير الطلبات</button>
    </div>
  </div>
  <h2>صافي الربح آخر 6 أشهر</h2>
  <div class="panel">
    <div class="trend" role="img" aria-label="صافي الربح أو الخسارة لكل شهر خلال آخر 6 أشهر">
      ${months.map((m) => `<div class="col" title="${periodLabel(m.k)}: ${moneyText(m.net)}">
        <div class="up">${m.net > 0 ? `<div class="bar" style="height:${(m.net / max) * 100}%"></div>` : ''}</div>
        <div class="down">${m.net < 0 ? `<div class="bar" style="height:${(-m.net / max) * 100}%"></div>` : ''}</div>
        <div class="lbl">${MONTHS[Number(m.k.slice(5)) - 1]}</div></div>`).join('')}
    </div>
    <p class="note">الأخضر ربح والأحمر خسارة.</p>
  </div>
  ${r.stockMoves.length ? `<h2>تلف وفروقات المخزون</h2><div class="list">${r.stockMoves.map((m) => { const f = findVariant(s, m.variantId); return `<div class="item"><div class="grow"><div>${f ? esc(f.p.name) + ' — ' + esc(f.v.label) : 'منتج محذوف'}</div><div class="meta">${esc(m.reason)} · ${dateText(m.at)}</div></div><b class="num" style="color:${(m.value || 0) < 0 ? 'var(--bad)' : 'var(--good)'}">${m.qty > 0 ? '+' : ''}${m.qty}</b><div style="min-width:100px;text-align:left">${money(Math.abs(m.value || 0))}</div></div>`; }).join('')}</div>` : ''}`;
}

function accCash(s) {
  const { rows, balance } = cashLedger(s);
  const unsettled = s.orders.filter((o) => o.status === 'delivered' && !o.settledAt);
  const due = unsettled.reduce((t, o) => t + settleValue(o), 0);
  const transit = s.orders.filter((o) => o.status === 'shipped').reduce((t, o) => t + settleValue(o), 0);
  const owedSup = s.suppliers.reduce((t, x) => t + Math.max(0, supplierBalance(s, x.id).owed), 0);
  return `
  <div class="panel">
    <div class="sub">رصيد الصندوق الآن</div>
    <div class="cash-big" style="color:${balance < 0 ? 'var(--bad)' : 'inherit'}">${money(balance)}</div>
    <div class="sub">رصيد البداية ${money(s.cashOpening)} · <button class="btn" type="button" data-act="cash-opening" style="min-height:30px;padding:2px 10px;font-size:13px">تعديل</button></div>
  </div>
  <dl class="money">
    <div class="cod"><dt>بذمّة شركة التوصيل (مُسلَّم)</dt><dd>${money(due)}</dd></div>
    <div><dt>طلبات في الطريق</dt><dd>${money(transit)}</dd></div>
    <div class="${owedSup ? 'neg' : ''}"><dt>ديون للموردين</dt><dd>${money(owedSup)}</dd></div>
    <div><dt>طلبات لم تُحصَّل</dt><dd><span class="num">${unsettled.length}</span></dd></div>
  </dl>
  ${unsettled.length ? `<button class="btn primary block" type="button" data-act="settle" style="margin-top:12px">استلمت مبلغاً من شركة التوصيل</button>` : ''}
  <h2>حركة الصندوق</h2>
  ${rows.length ? `<div class="list">${rows.slice(0, 60).map((r) => `<div class="item"><div class="grow"><div class="trunc">${esc(r.label)}</div><div class="meta">${dateText(r.at)}</div></div><b style="color:${r.amount < 0 ? 'var(--bad)' : 'var(--good)'}">${r.amount < 0 ? '−' : '+'} ${money(Math.abs(r.amount))}</b></div>`).join('')}</div>` : '<div class="list"><div class="empty">لا توجد حركة بعد.</div></div>'}
  <p class="note">يدخل الصندوق: ما تستلمه من شركة التوصيل. يخرج منه: المصروفات، ودفعات المشتريات والموردين.</p>`;
}

function accExpenses(s, key) {
  const r = monthReport(s, key);
  return `
  <div class="spread"><h2 style="margin-top:0">مصروفات ${periodLabel(key)}: ${money(r.exp)}</h2><button class="btn primary" type="button" data-act="new-expense">${icon('plus')} مصروف</button></div>
  ${r.byCat.length ? `<div class="panel" style="margin-bottom:12px"><table class="ledger">${r.byCat.map(([c, v]) => `<tr><td>${esc(c)}</td><td>${money(v)}</td></tr>`).join('')}</table></div>` : ''}
  ${r.expenses.length ? `<div class="list">${r.expenses.slice().sort((x, y) => y.at - x.at).map((e) => `<div class="item"><div class="grow"><div>${esc(e.category)}</div><div class="meta">${esc(e.note)} · ${dateText(e.at)}</div></div><div>${money(e.amount)}</div>
    <button class="icon-btn" type="button" data-delexp="${esc(e.id)}" aria-label="حذف المصروف" style="width:32px;height:32px">${icon('close')}</button></div>`).join('')}</div>` : '<div class="list"><div class="empty">لا مصروفات مسجّلة في هذه الفترة.</div></div>'}`;
}

function accInsights(s, key) {
  const r = monthReport(s, key);
  const stg = stagnant(s);
  return `
  <h2 style="margin-top:0">الأكثر مبيعاً في ${periodLabel(key)}</h2>
  ${r.top.length ? `<div class="list">${r.top.map((x, i) => `<div class="item"><span class="ono num">${i + 1}</span><div class="grow"><div class="trunc">${esc(x.name)}</div><div class="meta"><span class="num">${x.qty}</span> قطعة · ربح ${money(x.profit)}</div></div><div>${money(x.revenue)}</div></div>`).join('')}</div>` : '<div class="list"><div class="empty">لا توجد مبيعات مُسلَّمة في هذه الفترة.</div></div>'}
  <h2>منتجات راكدة <span class="sub">بلا طلبات خلال 30 يوماً</span></h2>
  ${stg.length ? `<div class="list">${stg.map((p) => `<button class="item" type="button" data-product="${esc(p.id)}">${tile(p, 'thumb')}<div class="grow trunc">${esc(p.name)}</div><div class="meta">في المخزن <span class="num">${totalStock(p)}</span> · قيمتها ${money(p.variants.reduce((t, v) => t + v.cost * v.stock, 0))}</div></button>`).join('')}</div>` : '<div class="list"><div class="empty">كل المنتجات تتحرك.</div></div>'}`;
}

/* ---------------- warehouse ---------------- */
function viewWarehouse() {
  const s = store();
  ensureShape(s);
  const tab = state.whTab || 'stock';
  const head = `<div class="spread"><h1>المخزن</h1><div class="row"><button class="btn" type="button" data-act="adjust-stock">تسوية / تالف</button><button class="btn primary" type="button" data-act="new-purchase">${icon('plus')} استلام بضاعة</button></div></div>
    ${segTabs('whtab', tab, [['stock', 'المخزون'], ['purchases', 'المشتريات'], ['suppliers', 'الموردون'], ['moves', 'الحركات']])}`;
  if (tab === 'purchases') return head + whPurchases(s);
  if (tab === 'suppliers') return head + whSuppliers(s);
  if (tab === 'moves') return head + whMoves(s);
  return head + whStock(s);
}

function whStock(s) {
  const rows = s.products.flatMap((p) => p.variants.map((v) => ({ p, v })));
  const units = rows.reduce((t, x) => t + x.v.stock, 0);
  const costVal = rows.reduce((t, x) => t + x.v.stock * x.v.cost, 0);
  const saleVal = rows.reduce((t, x) => t + x.v.stock * x.v.price, 0);
  const low = rows.filter((x) => x.v.stock > 0 && x.v.stock <= x.p.low);
  const out = rows.filter((x) => x.v.stock <= 0);
  const stg = new Set(stagnant(s).map((p) => p.id));
  const f = state.whFilter || 'all';
  const q = (state.wq || '').trim();
  let list = rows;
  if (f === 'low') list = low; else if (f === 'out') list = out; else if (f === 'stagnant') list = rows.filter((x) => stg.has(x.p.id));
  if (q) list = list.filter((x) => x.p.name.includes(q) || x.v.label.includes(q));
  const chips = [['all', 'الكل', rows.length], ['low', 'قليل', low.length], ['out', 'نفد', out.length], ['stagnant', 'راكد', rows.filter((x) => stg.has(x.p.id)).length]];
  return `
  <dl class="money" style="margin-top:0">
    <div><dt>قطع في المخزن</dt><dd><span class="num">${units.toLocaleString('en-US')}</span></dd></div>
    ${can('cost') ? `<div><dt>قيمة المخزون بالتكلفة</dt><dd>${money(costVal)}</dd></div>` : ''}
    <div><dt>قيمته بسعر البيع</dt><dd>${money(saleVal)}</dd></div>
    <div class="${out.length ? 'neg' : ''}"><dt>نفدت</dt><dd><span class="num">${out.length}</span> خيار</dd></div>
  </dl>
  <div class="search" style="margin-top:12px">${icon('search')}<input class="input" id="wq" type="search" placeholder="ابحث عن منتج أو خيار" value="${esc(q)}" aria-label="بحث في المخزون"></div>
  <div class="chips" role="group" aria-label="تصفية المخزون">${chips.map(([k, l, n]) => `<button class="chip" type="button" data-whf="${esc(k)}" aria-pressed="${f === k}">${l}<b class="num">${n}</b></button>`).join('')}</div>
  ${list.length ? `<div class="list">${list.map(({ p, v }) => `<button class="item" type="button" data-variant="${esc(v.id)}">
    ${tile(p, 'thumb')}
    <div class="grow"><div class="trunc">${esc(p.name)}</div><div class="meta">${esc(v.label)}${can('cost') ? ` · تكلفة ${money(v.cost)}` : ''}</div></div>
    <span class="qty-pill num ${v.stock <= 0 ? 'out' : v.stock <= p.low ? 'low' : ''}">${v.stock}</span></button>`).join('')}</div>`
    : '<div class="list"><div class="empty">لا توجد أصناف هنا.</div></div>'}`;
}

    <div style="text-align:left"><div>${money(pu.total)}</div>${pu.total > pu.paid ? `<div class="meta" style="color:var(--bad)">باقي ${money(pu.total - pu.paid)}</div>` : '<div class="meta">مدفوع</div>'}</div></button>`).join('')}</div>`

function whSuppliers(s) {

    <div class="grow"><div class="trunc">${esc(x.name)}</div><div class="meta">مشتريات ${money(b.bought)}${x.phone ? ` · <span class="num">${esc(x.phone)}</span>` : ''}</div></div>

const KIND_LABEL = { sale: 'بيع', return: 'إرجاع', purchase: 'شراء', adjust: 'تسوية', loss: 'تلف/فقدان', opening: 'رصيد افتتاحي' };
function whMoves(s) {
  const list = s.movements.slice().sort((a, b) => b.at - a.at).slice(0, 120);
  return list.length ? `<div class="list">${list.map((m) => { const f = findVariant(s, m.variantId); return `<div class="item">
    <div class="grow"><div class="trunc">${f ? esc(f.p.name) + ' — ' + esc(f.v.label) : 'منتج محذوف'}</div><div class="meta">${esc(m.reason)} · ${dateText(m.at)} · ${esc(m.by || '')}</div></div>

}

  if (!f) return;
  const { p, v } = f;
  const moves = s.movements.filter((m) => m.variantId === vid).sort((a, b) => b.at - a.at).slice(0, 15);
  openSheet(`${sheetHead(`${esc(p.name)} — ${esc(v.label)}`)}
    <dl class="kv">
      <dt>الكمية</dt><dd><b class="num">${v.stock}</b> ${v.stock <= p.low ? '<span class="tag warn">قليل</span>' : ''}</dd>
      <dt>سعر البيع</dt><dd>${money(v.price)}</dd>
      ${can('cost') ? `<dt>متوسط التكلفة</dt><dd>${money(v.cost)}</dd><dt>قيمة الموجود</dt><dd>${money(v.cost * v.stock)}</dd>` : ''}
      <dt>تنبيه عند</dt><dd><span class="num">${p.low}</span> قطع</dd>
    </dl>
    <div class="actions">
      <button class="btn primary" type="button" id="vRecv">استلام كمية</button>
      <button class="btn" type="button" id="vAdj">تسوية / تالف</button>
    </div>
    <h2>آخر الحركات</h2>
    ${moves.length ? `<div class="list">${moves.map((m) => `<div class="item"><div class="grow"><div>${esc(m.reason)}</div><div class="meta">${dateText(m.at)} · ${esc(m.by || '')}</div></div><b class="num" style="color:${m.qty < 0 ? 'var(--bad)' : 'var(--good)'}">${m.qty > 0 ? '+' : ''}${m.qty}</b></div>`).join('')}</div>` : '<p class="sub">لا حركات.</p>'}`,
