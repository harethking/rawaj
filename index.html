function variantOptions(s, selected) {
  return s.products.map((p) => p.variants.map((v) => `<option value="${v.id}" ${v.id === selected ? 'selected' : ''}>${esc(p.name)} — ${esc(v.label)} (الموجود ${v.stock})</option>`).join('')).join('');
}

function purchaseSheet(prefVid) {
  if (!can('warehouse')) return fail('لا تملك صلاحية المخزن');
  const s = store();
  if (!s.products.some((p) => p.variants.length)) return fail('أضف منتجاً أولاً من قسم المنتجات');
  const lines = [];
  openSheet(`${sheetHead('استلام بضاعة')}
    <form id="puForm" novalidate>
      <div class="field"><label for="puSup">المورد</label><input class="input" id="puSup" list="supList" maxlength="80" placeholder="اسم المورد أو التاجر">
        <datalist id="supList">${s.suppliers.map((x) => `<option value="${esc(x.name)}">`).join('')}</datalist></div>
      <div class="field"><label for="puVar">الصنف</label><select class="input" id="puVar">${variantOptions(s, prefVid)}</select></div>
      <div class="grid2">
        <div class="field"><label for="puQty">الكمية</label><input class="input num" id="puQty" inputmode="numeric" value="1" style="text-align:right"></div>
        <div class="field"><label for="puCost">تكلفة القطعة (د.ع)</label><input class="input num" id="puCost" inputmode="numeric" style="text-align:right"></div>
      </div>
      <button class="btn block" type="button" id="puAdd">+ أضف للفاتورة</button>
      <div id="puLines" style="margin-top:8px"></div>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label for="puPaid">المدفوع الآن (د.ع)</label><input class="input num" id="puPaid" inputmode="numeric" style="text-align:right"></div>
        <div class="field"><label for="puNote">ملاحظة</label><input class="input" id="puNote" maxlength="120" placeholder="رقم فاتورة المورد"></div>
      </div>
      <div class="tot grand"><span>إجمالي الفاتورة</span><span id="puTotal">${money(0)}</span></div>
      <div class="tot"><span>يبقى ديناً للمورد</span><span id="puDebt">${money(0)}</span></div>
      <div id="puErr" class="err" hidden></div>
      <button class="btn primary block" type="submit" style="margin-top:10px">حفظ واستلام البضاعة</button>
    </form>`,
  (sh) => {
    const n = (id) => Math.max(0, Math.round(Number(String(sh.querySelector(id).value).replace(/[^\d]/g, '')) || 0));
    const total = () => lines.reduce((t, l) => t + l.qty * l.cost, 0);
    let paidTouched = false;
    const setCost = () => { const f = findVariant(s, sh.querySelector('#puVar').value); if (f) sh.querySelector('#puCost').value = f.v.cost || ''; };
    setCost();
    const draw = () => {
      sh.querySelector('#puLines').innerHTML = lines.map((l, i) => { const f = findVariant(s, l.variantId); return `<div class="oline"><div class="grow">${esc(f.p.name)}<div class="sub">${esc(f.v.label)} · <span class="num">${l.qty}</span> × ${money(l.cost)}</div></div><b>${money(l.qty * l.cost)}</b><button class="icon-btn" type="button" data-rmline="${esc(i)}" aria-label="حذف" style="width:32px;height:32px">${icon('close')}</button></div>`; }).join('');
      if (!paidTouched) sh.querySelector('#puPaid').value = total();
      sh.querySelector('#puTotal').innerHTML = money(total());
      sh.querySelector('#puDebt').innerHTML = money(Math.max(0, total() - n('#puPaid')));
    };
    draw();
    sh.querySelector('#puVar').addEventListener('change', setCost);
    sh.querySelector('#puPaid').addEventListener('input', () => { paidTouched = true; draw(); });
    sh.querySelector('#puAdd').addEventListener('click', () => {
      const vid = sh.querySelector('#puVar').value, qty = n('#puQty'), cost = n('#puCost');
      const errEl = sh.querySelector('#puErr');
      if (qty <= 0 || cost <= 0) { errEl.textContent = 'اكتب كمية وتكلفة أكبر من صفر'; errEl.hidden = false; return; }
      errEl.hidden = true;
      const ex = lines.find((l) => l.variantId === vid && l.cost === cost);
      if (ex) ex.qty += qty; else lines.push({ variantId: vid, qty, cost });
      sh.querySelector('#puQty').value = 1;
      draw();
    });
    sh.querySelector('#puLines').addEventListener('click', (e) => { const b = e.target.closest('[data-rmline]'); if (b) { lines.splice(+b.dataset.rmline, 1); draw(); } });
    sh.querySelector('#puForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const errEl = sh.querySelector('#puErr');
      const supName = sh.querySelector('#puSup').value.trim();
      const tot = total(), paid = n('#puPaid');
      let err = '';
      if (!supName) err = 'اكتب اسم المورد';
      else if (!lines.length) err = 'أضف صنفاً واحداً على الأقل للفاتورة';
      else if (paid > tot) err = 'المدفوع أكبر من إجمالي الفاتورة';
      if (err) { errEl.textContent = err; errEl.hidden = false; return; }
      let sup = s.suppliers.find((x) => x.name === supName);
      if (!sup) { sup = { id: uid(), name: supName, phone: '' }; s.suppliers.push(sup); }
      const by = ROLES[state.role].l, at = Date.now();
      const pu = { id: uid(), supplierId: sup.id, at, lines: [], total: tot, paid, note: sh.querySelector('#puNote').value.trim() };
      for (const l of lines) {
        const { p, v } = findVariant(s, l.variantId);
        // Weighted average cost keeps profit figures honest when buying prices change.
        const before = Math.max(0, v.stock);
        v.cost = before + l.qty > 0 ? Math.round((before * v.cost + l.qty * l.cost) / (before + l.qty)) : l.cost;
        v.stock += l.qty;
        pu.lines.push({ variantId: v.id, name: p.name, label: v.label, qty: l.qty, cost: l.cost });
        s.movements.push({ id: uid(), kind: 'purchase', purchaseId: pu.id, variantId: v.id, qty: l.qty, value: l.qty * l.cost, reason: `استلام من ${sup.name}`, at, by });
      }
      s.purchases.push(pu);
      save(); closeSheet(); toast(`استُلمت ${lines.reduce((t, l) => t + l.qty, 0)} قطعة من ${sup.name}`); render();
    });
  });
}

const ADJ = {
  damage: { l: 'تالف', sign: -1 },
  lost:   { l: 'مفقود', sign: -1 },
  gift:   { l: 'هدية أو عينة', sign: -1 },
  count:  { l: 'جرد (الكمية الفعلية)', sign: 0 },
};
function adjustSheet(prefVid) {
  if (!can('warehouse')) return fail('لا تملك صلاحية المخزن');
  const s = store();
  if (!s.products.some((p) => p.variants.length)) return fail('أضف منتجاً أولاً من قسم المنتجات');
  openSheet(`${sheetHead('تسوية المخزون')}
    <form id="adjForm" novalidate>
      <div class="field"><label for="adjVar">الصنف</label><select class="input" id="adjVar">${variantOptions(s, prefVid)}</select></div>
      <div class="field"><label for="adjType">نوع التسوية</label><select class="input" id="adjType">${Object.keys(ADJ).map((k) => `<option value="${k}">${ADJ[k].l}</option>`).join('')}</select></div>
      <div class="field"><label for="adjQty" id="adjQtyLbl">الكمية الناقصة</label><input class="input num" id="adjQty" inputmode="numeric" value="1" style="text-align:right"></div>
      <div class="field"><label for="adjNote">السبب أو التفاصيل</label><input class="input" id="adjNote" maxlength="120"></div>
      <p class="sub" id="adjInfo"></p>
      <div id="adjErr" class="err" hidden></div>
      <button class="btn primary block" type="submit">حفظ التسوية</button>
    </form>`,
  (sh) => {
    const info = () => {
      const f = findVariant(s, sh.querySelector('#adjVar').value);
      const type = sh.querySelector('#adjType').value;
      sh.querySelector('#adjQtyLbl').textContent = type === 'count' ? 'الكمية الموجودة فعلاً بعد العدّ' : 'الكمية الناقصة';
      sh.querySelector('#adjInfo').textContent = f ? `الموجود في النظام: ${f.v.stock}. ${type === 'count' ? 'الفرق يُسجّل ربحاً أو خسارة بسعر التكلفة.' : 'تُحسب خسارة بسعر التكلفة في الأرباح والخسائر.'}` : '';
    };
    info();
    sh.querySelector('#adjVar').addEventListener('change', info);
    sh.querySelector('#adjType').addEventListener('change', () => { const f = findVariant(s, sh.querySelector('#adjVar').value); if (sh.querySelector('#adjType').value === 'count' && f) sh.querySelector('#adjQty').value = f.v.stock; info(); });
    sh.querySelector('#adjForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const errEl = sh.querySelector('#adjErr');
      const f = findVariant(s, sh.querySelector('#adjVar').value);
      const type = sh.querySelector('#adjType').value;
      const raw = String(sh.querySelector('#adjQty').value).trim();
      const qty = Math.round(Number(raw.replace(/[^\d]/g, '')));
      const note = sh.querySelector('#adjNote').value.trim();
      let diff;
      if (!raw || !Number.isFinite(qty)) { errEl.textContent = 'اكتب الكمية'; errEl.hidden = false; return; }
      if (type === 'count') diff = qty - f.v.stock;
      else {
        if (qty <= 0) { errEl.textContent = 'اكتب كمية أكبر من صفر'; errEl.hidden = false; return; }
        if (qty > f.v.stock) { errEl.textContent = `لا يمكن إنقاص أكثر من الموجود (${f.v.stock})`; errEl.hidden = false; return; }
        diff = -qty;
      }
      if (diff === 0) { errEl.textContent = 'الكمية مطابقة، لا يوجد فرق لتسجيله'; errEl.hidden = false; return; }
      f.v.stock += diff;
      s.movements.push({ id: uid(), kind: type === 'count' ? 'adjust' : 'loss', variantId: f.v.id, qty: diff, value: diff * f.v.cost,
        reason: `${ADJ[type].l}${note ? ': ' + note : ''}`, at: Date.now(), by: ROLES[state.role].l });
      save(); closeSheet(); toast(`سُجّلت التسوية (${diff > 0 ? '+' : ''}${diff})`); render();
    });
  });
}

function supplierSheet(id) {
  const s = store();
  const sup = s.suppliers.find((x) => x.id === id);
  if (!sup) return;
  const b = supplierBalance(s, id);
  const pays = s.supplierPayments.filter((p) => p.supplierId === id).sort((x, y) => y.at - x.at);
  const purs = s.purchases.filter((p) => p.supplierId === id).sort((x, y) => y.at - x.at);
  openSheet(`${sheetHead(esc(sup.name))}
    <dl class="money" style="margin-top:0">
      <div><dt>كل المشتريات</dt><dd>${money(b.bought)}</dd></div>
      <div><dt>المدفوع</dt><dd>${money(b.paid)}</dd></div>
      <div class="${b.owed > 0 ? 'neg' : ''}"><dt>الباقي عليك</dt><dd>${money(Math.max(0, b.owed))}</dd></div>
      <div><dt>عدد الفواتير</dt><dd><span class="num">${purs.length}</span></dd></div>
    </dl>
    <form id="spForm" novalidate style="margin-top:12px">
      <div class="field"><label for="spPhone">هاتف المورد</label><input class="input num" id="spPhone" inputmode="tel" value="${esc(sup.phone || '')}" style="text-align:right"></div>
      ${b.owed > 0 ? `<div class="grid2"><div class="field"><label for="spAmt">تسديد مبلغ (د.ع)</label><input class="input num" id="spAmt" inputmode="numeric" style="text-align:right" placeholder="${b.owed}"></div>
      <div class="field"><label for="spNote">ملاحظة</label><input class="input" id="spNote" maxlength="80"></div></div>` : ''}
      <div id="spErr" class="err" hidden></div>
      <button class="btn primary block" type="submit">${b.owed > 0 ? 'حفظ وتسجيل الدفعة' : 'حفظ'}</button>
    </form>
    <h2>الفواتير والدفعات</h2>
    <div class="list">${[...purs.map((p) => ({ at: p.at, html: `<button class="item" type="button" data-purchase="${esc(p.id)}"><div class="grow"><div>فاتورة شراء</div><div class="meta">${dateText(p.at)}</div></div><div>${money(p.total)}</div></button>` })),
      ...pays.map((p) => ({ at: p.at, html: `<div class="item"><div class="grow"><div>دفعة${p.note ? ': ' + esc(p.note) : ''}</div><div class="meta">${dateText(p.at)}</div></div><div style="color:var(--good)">${money(p.amount)}</div></div>` }))]
      .sort((x, y) => y.at - x.at).map((x) => x.html).join('') || '<div class="empty">لا شيء بعد.</div>'}</div>`,
  (sh) => {
    sh.querySelector('#spForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const errEl = sh.querySelector('#spErr');
      const phone = sh.querySelector('#spPhone').value.trim();
      if (phone && !validPhone(phone)) { errEl.textContent = 'رقم الهاتف يجب أن يكون 11 رقماً ويبدأ بـ 07'; errEl.hidden = false; return; }
      const amtEl = sh.querySelector('#spAmt');
      const amt = amtEl ? Math.round(Number(amtEl.value.replace(/[^\d]/g, '')) || 0) : 0;
      if (amt > b.owed) { errEl.textContent = `المبلغ أكبر من الدين (${moneyText(b.owed)})`; errEl.hidden = false; return; }
      sup.phone = phone ? normPhone(phone) : '';
      if (amt > 0) s.supplierPayments.push({ id: uid(), supplierId: sup.id, amount: amt, at: Date.now(), note: sh.querySelector('#spNote').value.trim() });
      save(); toast(amt > 0 ? `سُجّلت دفعة ${moneyText(amt)}` : 'حُفظ'); render(); supplierSheet(id);
    });
  });
}

function settleSheet() {
  const s = store();
  const list = s.orders.filter((o) => o.status === 'delivered' && !o.settledAt).sort((a, b) => statusAt(a, 'delivered') - statusAt(b, 'delivered'));
  if (!list.length) return;
  openSheet(`${sheetHead('استلام مبلغ من شركة التوصيل')}
    <p class="sub" style="margin-top:-6px">أشّر الطلبات التي استلمت مبلغها. المبلغ = قيمة المنتجات بعد الخصم (أجرة التوصيل تبقى عند الشركة).</p>
    <label class="check-row"><input type="checkbox" id="stAll" checked> <b>تحديد الكل</b></label>
    <div id="stList">${list.map((o) => `<label class="check-row"><input type="checkbox" data-st="${esc(o.id)}" checked>
      <span class="grow"><span class="num">#${o.no}</span> ${esc(o.customer.name)} <span class="sub">· ${dateText(statusAt(o, 'delivered'))}</span></span><span>${money(settleValue(o))}</span></label>`).join('')}</div>
    <div class="tot grand"><span>المبلغ المستلم</span><span id="stTotal"></span></div>
    <button class="btn primary block" type="button" id="stSave" style="margin-top:12px">تسجيل الاستلام في الصندوق</button>`,
  (sh) => {
    const boxes = () => $$('[data-st]', sh);
    const upd = () => {
      const ids = new Set(boxes().filter((b) => b.checked).map((b) => b.dataset.st));
      sh.querySelector('#stTotal').innerHTML = money(list.filter((o) => ids.has(o.id)).reduce((t, o) => t + settleValue(o), 0));
      sh.querySelector('#stSave').disabled = ids.size === 0;
    };
    upd();
    sh.querySelector('#stAll').addEventListener('change', (e) => { boxes().forEach((b) => { b.checked = e.target.checked; }); upd(); });
    sh.querySelector('#stList').addEventListener('change', upd);
    sh.querySelector('#stSave').addEventListener('click', () => {
      const ids = new Set(boxes().filter((b) => b.checked).map((b) => b.dataset.st));
      const now = Date.now();
      let sum = 0;
      for (const o of list) if (ids.has(o.id)) { o.settledAt = now; sum += settleValue(o); }
      save(); closeSheet(); toast(`دخل الصندوق ${moneyText(sum)}`); render();
    });
  });
}

function viewCoupons() {

function couponSheet(i) {
  const s = store();
  if (!Array.isArray(s.coupons)) s.coupons = [];
  const c = i != null ? s.coupons[i] : { code: '', type: 'percent', value: 10, active: true, used: 0 };
  const day = (ts) => (ts ? new Date(ts - new Date(ts).getTimezoneOffset() * 6e4).toISOString().slice(0, 10) : '');
  openSheet(`${sheetHead(i != null ? 'تعديل الكوبون' : 'كوبون جديد')}
    <form id="cpForm" novalidate>
      <div class="field"><label for="cpCode">رمز الكوبون</label><input class="input num" id="cpCode" maxlength="16" dir="ltr" style="text-align:left;text-transform:uppercase" placeholder="WELCOME10" value="${esc(c.code)}" ${i != null && c.used ? 'readonly' : ''}><small class="sub">حروف إنجليزية وأرقام، من 3 إلى 16.</small></div>
      <div class="grid2">
        <div class="field"><label for="cpType">نوع الخصم</label><select class="input" id="cpType"><option value="percent" ${c.type === 'percent' ? 'selected' : ''}>نسبة %</option><option value="fixed" ${c.type === 'fixed' ? 'selected' : ''}>مبلغ ثابت (د.ع)</option></select></div>
        <div class="field"><label for="cpValue">قيمة الخصم</label><input class="input num" id="cpValue" inputmode="numeric" value="${c.value}" style="text-align:right"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="cpMin">أقل قيمة طلب (اختياري)</label><input class="input num" id="cpMin" inputmode="numeric" value="${c.min || ''}" style="text-align:right"></div>
        <div class="field"><label for="cpMax">عدد مرات الاستخدام (اختياري)</label><input class="input num" id="cpMax" inputmode="numeric" value="${c.max || ''}" style="text-align:right"></div>
      </div>
      <div class="field"><label for="cpExp">ينتهي بتاريخ (اختياري)</label><input class="input" id="cpExp" type="date" value="${day(c.expires)}"></div>
      <label class="row" style="margin:6px 0 12px"><input type="checkbox" id="cpActive" ${c.active ? 'checked' : ''}> فعّال</label>
      <div id="cpErr" class="err" hidden></div>
      <div class="actions">${i != null ? '<button class="btn danger" type="button" id="cpDel">حذف</button><button class="btn" type="button" id="cpShare">نسخ نص للنشر</button>' : ''}<button class="btn primary" type="submit">حفظ</button></div>
    </form>`, (sh) => {
    const num = (id) => Math.round(Number(sh.querySelector(id).value.replace(/[,\s]/g, '')) || 0);
    sh.querySelector('#cpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = sh.querySelector('#cpCode').value.trim().toUpperCase();
      const type = sh.querySelector('#cpType').value, value = num('#cpValue');
      const exp = sh.querySelector('#cpExp').value;
      const errEl = sh.querySelector('#cpErr');
      let err = '';
      if (!/^[A-Z0-9]{3,16}$/.test(code)) err = 'الرمز من 3 إلى 16 حرفاً إنجليزياً أو رقماً';
      else if (s.coupons.some((x, j) => j !== i && x.code.toUpperCase() === code)) err = 'هذا الرمز موجود';
      else if (type === 'percent' && (value < 1 || value > 90)) err = 'النسبة من 1 إلى 90';
      else if (type === 'fixed' && value < 250) err = 'المبلغ 250 دينار على الأقل';
      if (err) { errEl.textContent = err; errEl.hidden = false; return; }
      const next = { code, type, value, min: num('#cpMin') || 0, max: num('#cpMax') || 0, expires: exp ? new Date(exp + 'T23:59:59').getTime() : 0, active: sh.querySelector('#cpActive').checked, used: c.used || 0 };
      if (i != null) s.coupons[i] = next; else s.coupons.unshift(next);
      save(); closeSheet(); render(); toast('حُفظ الكوبون');
    });
    const del = sh.querySelector('#cpDel');
    if (del) del.addEventListener('click', () => confirmSheet('حذف الكوبون', `حذف ${c.code}؟ ما يگدر أحد يستخدمه بعد الحذف.`, 'حذف', true).then((ok) => { if (ok) { s.coupons.splice(i, 1); save(); render(); toast('حُذف الكوبون'); } else couponSheet(i); }));
    const share = sh.querySelector('#cpShare');
    if (share) share.addEventListener('click', () => copyText(`🎁 ${couponText(c)} على متجر ${s.name}\nاكتب الكوبون ${c.code} عند الطلب\n${publicLink(s)}`).then((ok) => toast(ok ? 'نُسخ النص، انشره بصفحاتك' : 'تعذّر النسخ', !ok)));
  });
}

function orderSheet(id) {
  const s = store();
  const o = s.orders.find((x) => x.id === id);
  if (!o) return;
  const sub = orderSubtotal(o);
  const nexts = can('orders.write') ? NEXT[o.status] : [];
  openSheet(`${sheetHead(`طلب <span class="num">#${o.no}</span> ${badge(o.status)}`)}
    <div class="cust">
      <div class="spread"><b>${esc(o.customer.name)}</b><a class="btn" href="tel:${esc(normPhone(o.customer.phone))}" style="min-height:34px;padding:4px 12px">${icon('phone')} اتصال</a></div>
      <div class="num" style="margin-top:4px">${esc(o.customer.phone)}</div>
      <div class="sub">${esc(o.customer.city)} — ${esc(o.customer.address)}</div>
      ${o.note ? `<div class="sub">ملاحظة: ${esc(o.note)}</div>` : ''}
    </div>
    <table class="lines">${o.items.map((it) => `<tr><td>${esc(it.name)}<div class="sub">${esc(it.label)} × <span class="num">${it.qty}</span></div></td><td>${money(it.price * it.qty)}</td></tr>`).join('')}</table>
    <div style="margin-top:8px">
      <div class="tot"><span>المجموع</span><span>${money(sub)}</span></div>
      ${o.discount ? `<div class="tot"><span>خصم${o.coupon ? ` (كوبون <span class="num">${esc(o.coupon)}</span>)` : ''}</span><span>− ${money(o.discount)}</span></div>` : ''}
      <div class="tot"><span>أجرة التوصيل</span><span>${money(o.delivery)}</span></div>
      <div class="tot grand"><span>المبلغ المطلوب من الزبون</span><span>${money(orderTotal(o))}</span></div>
      ${can('cost') ? `<div class="tot"><span>ربح الطلب (قبل المصروفات)</span><span>${money(Math.max(0, sub - o.discount) - orderCost(o))}</span></div>` : ''}
    </div>
    ${nexts.length ? `<div class="actions">${nexts.map((t) => `<button class="btn ${t === 'canceled' || t === 'returned' ? 'danger' : 'primary'}" type="button" data-to="${esc(t)}">${ACTION_LABEL[t]}</button>`).join('')}</div>` : ''}
    <div class="actions">
      <button class="btn" type="button" data-act="copy-order">${icon('copy')} نسخ للواتساب</button>
      <button class="btn" type="button" data-act="print-order">${icon('print')} طباعة الفاتورة</button>
    </div>
    <div id="wsOrder"></div>
    <h2 style="margin-top:20px">سجل الطلب</h2>
    <ol class="timeline">${o.history.slice().reverse().map((h) => `<li style="--c:${STATUS[h.to].c}">${STATUS[h.to].l}<small>${dateText(h.at)} ${new Date(h.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · ${esc(h.by || '')}</small></li>`).join('')}</ol>
    <p class="sub">المصدر: ${o.source === 'storefront' ? 'واجهة المتجر' : 'إدخال يدوي'}</p>`,
  (sh) => {
    $$('[data-to]', sh).forEach((b) => b.addEventListener('click', async () => {
      const to = b.dataset.to;
      if (to === 'canceled' || to === 'returned') {
        const ok = await confirmSheet(ACTION_LABEL[to], STOCK_OUT.has(o.status) ? 'ستعود الكميات إلى المخزون ويُسجَّل ذلك في حركات المخزون.' : 'لن يمكن التراجع عن هذه الخطوة.', ACTION_LABEL[to], true);
        if (!ok) { orderSheet(id); return; }
      }
      if (changeStatus(o, to)) {
        toast(`الطلب #${o.no}: ${STATUS[to].l}`);
        render();
        orderSheet(id);
      }
    }));
    sh.querySelector('[data-act="copy-order"]').addEventListener('click', async () => {
      const txt = [`طلب #${o.no} — ${s.name}`, `${o.customer.name} | ${normPhone(o.customer.phone)}`, `${o.customer.city} — ${o.customer.address}`, '',
        ...o.items.map((it) => `• ${it.name} (${it.label}) × ${it.qty} = ${moneyText(it.price * it.qty)}`), '',
        o.discount ? `خصم: ${moneyText(o.discount)}` : null, `التوصيل: ${moneyText(o.delivery)}`, `المطلوب: ${moneyText(orderTotal(o))}`].filter((x) => x !== null).join('\n');
      toast((await copyText(txt)) ? 'نُسخت تفاصيل الطلب' : 'تعذّر النسخ، انسخ يدوياً', false);
    });
    sh.querySelector('[data-act="print-order"]').addEventListener('click', () => printOrder(o));
    fillWsOrder(o, id).catch(() => {});
  });
}

    <p><b>فاتورة طلب #${o.no}</b> — ${dateText(o.createdAt)}</p>

    <table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr>
    ${o.items.map((it) => `<tr><td>${esc(it.name)} (${esc(it.label)})</td><td>${it.qty}</td><td>${moneyText(it.price)}</td><td>${moneyText(it.price * it.qty)}</td></tr>`).join('')}</table>

function newOrderSheet(prefill) {
  if (!can('orders.write')) return fail('لا تملك صلاحية إضافة طلبات');
  const s = store();
  const draft = { lines: [], discount: 0 };
  const fee0 = deliveryOf(s, prefill && prefill.city ? prefill.city : CITIES[0]);
  const variants = s.products.filter((p) => p.active).flatMap((p) => p.variants.map((v) => ({ p, v })));
  openSheet(`${sheetHead('طلب جديد')}
    <form id="orderForm" novalidate>
      <div class="field"><label for="oPhone">هاتف الزبون</label><input class="input num" id="oPhone" inputmode="tel" placeholder="07XXXXXXXXX" style="text-align:right" value="${esc(prefill ? prefill.phone : '')}"></div>
      <div class="field"><label for="oName">اسم الزبون</label><input class="input" id="oName" maxlength="80" value="${esc(prefill ? prefill.name : '')}"></div>
      <div class="grid2">
        <div class="field"><label for="oCity">المحافظة</label><select class="input" id="oCity">${CITIES.map((c) => `<option ${prefill && prefill.city === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="oDelivery">أجرة التوصيل</label><input class="input num" id="oDelivery" inputmode="numeric" value="${fee0}" style="text-align:right"></div>
      </div>
      <div class="field"><label for="oAddr">العنوان</label><input class="input" id="oAddr" maxlength="200" placeholder="المنطقة، أقرب نقطة دالة" value="${esc(prefill ? prefill.address : '')}"></div>
      <div class="field"><label for="oVariant">إضافة منتج</label>
        <div class="row"><select class="input grow" id="oVariant">${variants.map(({ p, v }) => `<option value="${v.id}" ${v.stock <= 0 ? 'disabled' : ''}>${esc(p.name)} — ${esc(v.label)} (${v.stock > 0 ? `متوفر ${v.stock}` : 'نفد'})</option>`).join('')}</select>
        <button class="btn" type="button" id="oAdd">إضافة</button></div></div>
      <div id="oLines"></div>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label for="oDiscount">خصم</label><input class="input num" id="oDiscount" inputmode="numeric" value="0" style="text-align:right"></div>
        <div class="field"><label for="oNote">ملاحظة</label><input class="input" id="oNote" maxlength="200"></div>
      </div>
      <div class="tot grand"><span>المبلغ المطلوب</span><span id="oTotal">${money(0)}</span></div>
      <div id="oErr" class="err" hidden></div>
      <button class="btn primary block" type="submit" style="margin-top:12px">حفظ الطلب</button>
    </form>`,
  (sh) => {
    const num = (id) => Math.max(0, Math.round(Number(String(sh.querySelector(id).value).replace(/[^\d]/g, '')) || 0));
    const draw = () => {
      sh.querySelector('#oLines').innerHTML = draft.lines.map((l, i) => {
        const f = findVariant(s, l.variantId);
        return `<div class="oline"><div class="grow">${esc(f.p.name)}<div class="sub">${esc(f.v.label)} · ${money(f.v.price)}</div></div>
          <div class="qty"><button type="button" data-dec="${esc(i)}" aria-label="إنقاص">−</button><span class="num">${l.qty}</span><button type="button" data-inc="${esc(i)}" aria-label="زيادة">+</button></div>
          <button class="icon-btn" type="button" data-rm="${esc(i)}" aria-label="حذف" style="width:32px;height:32px">${icon('close')}</button></div>`;
      }).join('') || '<p class="sub">لم تُضف منتجات بعد.</p>';
      const sub = draft.lines.reduce((t, l) => t + findVariant(s, l.variantId).v.price * l.qty, 0);
      sh.querySelector('#oTotal').innerHTML = money(Math.max(0, sub - num('#oDiscount')) + num('#oDelivery'));
    };
    draw();
    sh.querySelector('#oAdd').addEventListener('click', () => {
      const vid = sh.querySelector('#oVariant').value;
      if (!vid) return;
      const ex = draft.lines.find((l) => l.variantId === vid);
      if (ex) ex.qty++; else draft.lines.push({ variantId: vid, qty: 1 });
      draw();
    });
    sh.querySelector('#oLines').addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.dataset.inc != null) draft.lines[+t.dataset.inc].qty++;
      if (t.dataset.dec != null) { const l = draft.lines[+t.dataset.dec]; l.qty = Math.max(1, l.qty - 1); }
      if (t.dataset.rm != null) draft.lines.splice(+t.dataset.rm, 1);
      draw();
    });
    ['#oDiscount', '#oDelivery'].forEach((id) => sh.querySelector(id).addEventListener('input', draw));
    sh.querySelector('#oCity').addEventListener('change', (e) => { sh.querySelector('#oDelivery').value = deliveryOf(s, e.target.value); draw(); });
    sh.querySelector('#oPhone').addEventListener('change', (e) => {
      const c = customersOf(s).find((x) => x.phone === normPhone(e.target.value));
      if (!c) return;
      const n = sh.querySelector('#oName'), a = sh.querySelector('#oAddr');
      if (!n.value) n.value = c.name;
      if (!a.value) a.value = c.address;
      sh.querySelector('#oCity').value = c.city;
      toast(`زبون سابق: ${c.orders.length} طلب`);
    });
    sh.querySelector('#orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const errEl = sh.querySelector('#oErr');
      const phone = sh.querySelector('#oPhone').value, name = sh.querySelector('#oName').value.trim();
      const address = sh.querySelector('#oAddr').value.trim();
      let err = '';
      if (!validPhone(phone)) err = 'رقم الهاتف يجب أن يكون 11 رقماً ويبدأ بـ 07';
      else if (!name) err = 'اكتب اسم الزبون';
      else if (!address) err = 'اكتب العنوان';
      else if (!draft.lines.length) err = 'أضف منتجاً واحداً على الأقل';
      const sub = draft.lines.reduce((t, l) => t + findVariant(s, l.variantId).v.price * l.qty, 0);
      if (!err && num('#oDiscount') > sub) err = 'الخصم أكبر من مجموع المنتجات';
      if (err) { errEl.textContent = err; errEl.hidden = false; return; }
      const items = draft.lines.map((l) => { const { p, v } = findVariant(s, l.variantId); return { productId: p.id, variantId: v.id, name: p.name, label: v.label, price: v.price, cost: v.cost, qty: l.qty }; });
      const o = createOrder(s, { customer: { name, phone: normPhone(phone), city: sh.querySelector('#oCity').value, address }, items, discount: num('#oDiscount'), delivery: num('#oDelivery'), note: sh.querySelector('#oNote').value.trim() }, 'manual', ROLES[state.role].l);
      closeSheet();
      toast(`سُجّل الطلب #${o.no}`);
      render();
    });
  });
}

          <datalist id="cats">${Array.from(new Set(s.products.map((x) => x.category))).map((c) => `<option value="${esc(c)}">`).join('')}</datalist></div>

      <div class="field"><label for="pDesc">الوصف</label><textarea class="input" id="pDesc" maxlength="500" ${dis}>${esc(p.desc)}</textarea></div>
      <div class="psec" style="--c:#e08a00">الخيارات والأسعار</div>
      <div class="field"><label>الخيارات (لون، مقاس، حجم)</label>
        <div class="vrow head"><span>الخيار</span><span>سعر البيع</span><span>${showCost ? 'التكلفة' : ''}</span><span>المخزون</span><span></span></div>
        <div id="pVars"></div>

      </div>
      <div class="psec" style="--c:#e0457b">الخصم</div>

      <div class="field" id="pReasonWrap" hidden><label for="pReason">سبب تعديل المخزون</label><input class="input" id="pReason" maxlength="120" placeholder="مثال: جرد، تالف، استلام بضاعة"></div>
      <div class="psec" style="--c:#2a9d8f">الظهور</div>
      <label class="row" style="margin:6px 0 12px"><input type="checkbox" id="pActive" ${p.active ? 'checked' : ''} ${dis}> يظهر للزبائن في واجهة المتجر</label>
      <div id="pErr" class="err" hidden></div>
      ${edit ? `<button class="btn primary block" type="submit">${existing ? 'حفظ التغييرات' : 'إضافة المنتج'}</button>${existing ? '<button class="btn danger block" type="button" id="pDel" style="margin-top:8px">حذف المنتج</button>' : ''}` : '<p class="sub">عرض فقط: دورك لا يسمح بتعديل المنتجات.</p>'}
    </form>
    ${moves.length ? `<h2>آخر حركات المخزون</h2><div class="list">${moves.map((m) => `<div class="item"><div class="grow"><div>${esc(m.reason)}</div><div class="meta">${esc(vLabel(m.variantId))} · ${dateText(m.at)} · ${esc(m.by)}</div></div><b class="num" style="color:${m.qty < 0 ? 'var(--bad)' : 'var(--good)'}">${m.qty > 0 ? '+' : ''}${m.qty}</b></div>`).join('')}</div>` : ''}`,

      const v0 = p.variants[0];
      const on = !!(d && v0 && v0.price > 0);
      sh.querySelector('#pDiscBox').classList.toggle('on', on);
      sh.querySelector('#pDiscHint').innerHTML = on ? `بعد الخصم يصير سعر الخيار الأول <b>${money(Math.round(v0.price * (100 - d) / 100))}</b>` : 'بدون خصم حالياً';
    };
    sh.addEventListener('input', updDisc);
    updDisc();
    const draw = () => {
      sh.querySelector('#pVars').innerHTML = p.variants.map((v, i) => `<div class="vrow">
        <input class="input" data-k="label" data-i="${esc(i)}" value="${esc(v.label)}" placeholder="مثال: أسود / L" aria-label="اسم الخيار" ${dis}>

        ${showCost ? `<input class="input num" data-k="cost" data-i="${esc(i)}" inputmode="numeric" value="${v.cost}" aria-label="التكلفة" style="text-align:right" ${dis}>` : '<span></span>'}
        <input class="input num" data-k="stock" data-i="${esc(i)}" inputmode="numeric" value="${v.stock}" aria-label="المخزون" style="text-align:right" ${dis}>
        ${edit && v.fresh ? `<button class="x" type="button" data-rmv="${esc(i)}" aria-label="حذف الخيار">×</button>` : '<span></span>'}
      </div>`).join('');
    };
    if (!Array.isArray(p.images)) p.images = [];
    const drawImgs = () => {
      sh.querySelector('#pImgs').innerHTML = p.images.length ? p.images.map((id, i) => `<div class="pimg ${i === 0 ? 'first' : ''}"><img data-img="${esc(id)}" alt="صورة ${i + 1}">
        ${edit ? `<button class="x" type="button" data-rmimg="${esc(i)}" aria-label="حذف الصورة">×</button>${i > 0 ? `<button class="cover" type="button" data-cover="${esc(i)}">اجعلها الغلاف</button>` : ''}` : ''}</div>`).join('')
        : '<p class="sub" style="grid-column:1/-1;margin:0">لا توجد صور بعد.</p>';
      const up = sh.querySelector('#pUpBtn');
      if (up) up.hidden = p.images.length >= imgMaxFor(store());
    };
    drawImgs();
    sh.querySelector('#pImgs').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.rmimg != null) p.images.splice(+b.dataset.rmimg, 1);
      if (b.dataset.cover != null) { const [im] = p.images.splice(+b.dataset.cover, 1); p.images.unshift(im); }
      drawImgs();
    });
    const pd = sh.querySelector('#pDel');
    if (pd) pd.addEventListener('click', () => confirmSheet('حذف المنتج', `حذف "${esc(p.name)}"؟ ما يرجع بعد الحذف، وتنحذف صوره.`, 'حذف', true).then((ok) => {
      if (!ok) return;
      const s2 = store();
      s2.products = s2.products.filter((x) => x.id !== existing.id);
      imgDel(existing.images || []);
      save(); render(); closeSheet();
      toast('حُذف المنتج');
    }));
    const pf = sh.querySelector('#pFile');
    if (pf) pf.addEventListener('change', async () => {
      const room = imgMaxFor(store()) - p.images.length;
      if (room <= 0) return;
      toast('جارِ ضغط الصور ورفعها…');
      const { ids, skipped, sizes } = await addImages(pf.files, room, 1200);
      pf.value = '';
      p.images.push(...ids);
      drawImgs();
      const kb = sizes.length ? Math.round(sizes.reduce((x, y) => x + y, 0) / sizes.length / 1024) : 0;
      toast(skipped ? `أُضيفت ${ids.length} صورة، وتُركت ${skipped} (ليست صورة أو تعذّر رفعها)` : `أُضيفت ${ids.length} صورة · حجم الصورة نحو ${kb} KB`, !!skipped && !ids.length);
    });
    const stockChanged = () => p.variants.some((v) => orig.has(v.id) && orig.get(v.id) !== v.stock);
    draw();
    sh.querySelector('#pVars').addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.i == null) return;
      const v = p.variants[+t.dataset.i];
      v[t.dataset.k] = t.dataset.k === 'label' ? t.value : Math.max(0, Math.round(Number(t.value.replace(/[^\d]/g, '')) || 0));
      sh.querySelector('#pReasonWrap').hidden = !stockChanged();
    });
    sh.querySelector('#pVars').addEventListener('click', (e) => {
      const t = e.target.closest('[data-rmv]');
      if (!t || p.variants.length <= 1) return;
      p.variants.splice(+t.dataset.rmv, 1);
      draw();
    });
    const add = sh.querySelector('#pAddVar');
    if (add) add.addEventListener('click', () => { p.variants.push({ id: uid(), label: '', price: p.variants[0] ? p.variants[0].price : 0, cost: p.variants[0] ? p.variants[0].cost : 0, stock: 0, fresh: true }); draw(); });
    sh.querySelector('#pForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!edit) return;
      const errEl = sh.querySelector('#pErr');
      const name = sh.querySelector('#pName').value.trim();
      const reason = sh.querySelector('#pReason').value.trim();
      let err = '';
      if (!name) err = 'اكتب اسم المنتج';
      else if (p.variants.some((v) => !v.label.trim())) err = 'اكتب اسماً لكل خيار';
      else if (new Set(p.variants.map((v) => v.label.trim())).size !== p.variants.length) err = 'يوجد خياران بنفس الاسم';
      else if (p.variants.some((v) => v.price <= 0)) err = 'سعر البيع يجب أن يكون أكبر من صفر';
      else if (showCost && p.variants.some((v) => v.cost > v.price)) err = 'التكلفة أكبر من سعر البيع في أحد الخيارات';
      else if (stockChanged() && !reason) err = 'اكتب سبب تعديل المخزون';
      else if (sh.querySelector('#pActive').checked && !(existing && existing.active) && s.products.filter((x) => x.active).length >= publishedLimit(s))
        err = `نسخة عادي تسمح بـ ${BASIC_LIMIT} منتجات منشورة فقط. ألغِ «يظهر للزبائن» لحفظه مخفياً، أو رقِّ لنسخة برو لمنتجات بلا حدود.`;
      if (err) { errEl.textContent = err; errEl.hidden = false; return; }
      const by = ROLES[state.role].l;
      const now = Date.now();
      const clean = { ...p, name, category: sh.querySelector('#pCat').value.trim() || 'عام', desc: sh.querySelector('#pDesc').value.trim(), low: Math.max(0, Math.round(Number(sh.querySelector('#pLow').value) || 0)), active: sh.querySelector('#pActive').checked, discount: Math.min(90, Math.max(0, Math.round(Number(sh.querySelector('#pDisc').value) || 0))) };
      clean.variants = p.variants.map((v) => {
        const before = orig.has(v.id) ? orig.get(v.id) : 0;
        const diff = v.stock - before;
        if (diff !== 0) s.movements.push({ id: uid(), kind: orig.has(v.id) ? 'adjust' : 'opening', variantId: v.id, qty: diff, value: diff * v.cost, reason: orig.has(v.id) ? `تعديل يدوي: ${reason}` : 'رصيد افتتاحي', at: now, by });
        return { id: v.id, label: v.label.trim(), price: v.price, cost: showCost ? v.cost : (existing && existing.variants.find((x) => x.id === v.id) || { cost: 0 }).cost, stock: v.stock };
      });
      clean.images = p.images.slice();
      const dropped = ((existing && existing.images) || []).filter((im) => !clean.images.includes(im));
      if (dropped.length) imgDel(dropped);
      if (existing) { Object.assign(existing, clean); } else { clean.id = uid(); s.products.push(clean); }
      save();
      closeSheet();
      toast(existing ? 'حُفظت التغييرات' : 'أُضيف المنتج');
      render();
    });
  });
}

/* ---------------- public store page (what the shared link shows) ----------------
   Products by section, a cart and checkout. No stock numbers, costs or other customers' data.
   Orders go through the place_order database function, which recomputes every price itself. */
let sfStore = null;   // the store whose public page is open
let sfPublic = false; // true when opened from a public /s/slug link (no login)
let cart = [];        // [{ pid, vid, qty }] kept per store in this browser
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } };
const cartKey = () => `rawaj-cart-${sfStore ? sfStore.slug : ''}`;
// Product discount: a percentage (0-90) taken off every option's price.
const discOf = (p) => Math.min(90, Math.max(0, Math.round(Number(p && p.discount) || 0)));
const effPrice = (p, v) => { const d = discOf(p); return d ? Math.round(v.price * (100 - d) / 100) : v.price; };
function priceText(p) {
  const ps = p.variants.map((v) => effPrice(p, v));
  const lo = Math.min(...ps), hi = Math.max(...ps);
  return lo === hi ? money(lo) : `من ${money(lo)}`;
}
function priceHtml(p) {
  if (!discOf(p)) return priceText(p);
  const lo = Math.min(...p.variants.map((v) => v.price));
  return `<s class="sub">${money(lo)}</s> ${priceText(p)}`;
}
const showLabel = (p, v) => p.variants.length > 1 || (v.label && !/^(افتراضي|default|-)$/i.test(v.label.trim()));
function sfItems() {
  if (statusOf(sfStore) === 'suspended') return [];
  const all = sfStore.products.filter((p) => p.active && p.variants.length);
  return sfPublic || !sfStore.plan ? all : all.slice(0, publishedLimit(sfStore)); // public data is already limited by the server
}
function cartLines() {
  const out = [];
  for (const c of cart) {
    const p = sfStore.products.find((x) => x.id === c.pid && x.active);
    const v = p && p.variants.find((x) => x.id === c.vid);
    if (v) out.push({ p, v, qty: c.qty });
  }
  return out;
}
const cartCount = () => cartLines().reduce((t, l) => t + l.qty, 0);
const cartSub = () => cartLines().reduce((t, l) => t + effPrice(l.p, l.v) * l.qty, 0);
function cartAdd(pid, vid, qty) {
  const ex = cart.find((c) => c.pid === pid && c.vid === vid);
  if (ex) ex.qty = Math.min(99, ex.qty + qty); else cart.push({ pid, vid, qty: Math.min(99, qty) });
  lsSet(cartKey(), cart);
  sfCartUI();
}
function sfCartUI() {
  const n = cartCount();
  const c = $('#sfCount');
  if (c) { c.textContent = n; c.hidden = !n; }
  const bar = $('#sfCartBar');
  if (bar) {
    bar.hidden = !n;
    bar.innerHTML = n ? `<button type="button" data-act="sf-cart">${icon('bag')}<span class="grow" style="text-align:start">عرض السلة</span><span class="n">${n}</span><span>${money(cartSub())}</span></button>` : '';
  }
}

// Short store links: <site>/<slug> (404.html on GitHub Pages forwards it to <site>/#<slug>).
function siteBase() {
  if (SITE_URL) return SITE_URL.replace(/\/?$/, '/');
  return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
}
function publicLink(s) { const b = siteBase(); return /^https?:/.test(b) ? b + s.slug : `${b}#${s.slug}`; }
const shortLink = (s) => publicLink(s).replace(/^https?:\/\//, '');
const SLUG_RE = /^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$/;
function slugFromLocation() {
  const h = location.hash.replace(/^#\/?(s\/)?/, '');
  if (h && SLUG_RE.test(h)) return h;
  const q = new URLSearchParams(location.search).get('s');
  return q && SLUG_RE.test(q) ? q : null;
}
function closeStorefront() {
  $('#storefront').classList.remove('open');
  closeSheet();
  document.body.style.overflow = '';
  sfStore = null; sfPublic = false;
  if (slugFromLocation()) history.replaceState(null, '', location.href.split('#')[0].split('?')[0]);
  render();
}
// Public store page: anyone with the link sees it without logging in (public_store returns names, prices and images only).
async function routePublic() {
  const slug = slugFromLocation();
  if (!slug) return false;
  const m = [null, slug];
  const sf = $('#storefront');
  if (!sf.classList.contains('open')) { sf.innerHTML = '<div class="sf-skel"></div><div class="sf-skel" style="height:220px"></div>'; sf.classList.add('open'); document.body.style.overflow = 'hidden'; }
  const { data, error } = await sb.rpc('public_store', { p_slug: m[1] });
  if (error || !data) {
    if (!sfStore) { sf.classList.remove('open'); document.body.style.overflow = ''; }
    toast(error ? 'تعذّر تحميل المتجر، تحقق من الإنترنت' : 'لا يوجد متجر بهذا الرابط', true);
    return false;
  }
  const s = Object.assign({ status: 'active', color: TILE_COLORS[0] }, data);
  s.products = (data.products || []).map((p) => ({ ...p, active: true, images: p.images || [], variants: (p.variants || []).map((v) => ({ ...v, price: Number(v.price) || 0 })) }));
  sanitizeStore(s);
  if (s.name) document.title = `${s.name} — متجر على رواج`;
  openStorefront(s, true);
  return true;
}

      hydrateImages(sh);
      $$('[data-gal]', sh).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    }));
    if (closed) return;
    const draw = () => {
      const v = vid && p.variants.find((x) => x.id === vid);
      sh.querySelector('#spQty').textContent = qty;
      sh.querySelector('#spLine').innerHTML = v ? money(effPrice(p, v) * qty) : '';
      if (v) sh.querySelector('#spPrice').innerHTML = money(effPrice(p, v));
    };
    $$('[data-v]', sh).forEach((b) => b.addEventListener('click', () => {
      vid = b.dataset.v;
      $$('[data-v]', sh).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      sh.querySelector('#spErr').hidden = true;
      draw();
    }));
    $$('[data-q]', sh).forEach((b) => b.addEventListener('click', () => { qty = Math.min(99, Math.max(1, qty + Number(b.dataset.q))); draw(); }));
    const take = () => {
      if (!vid) { const e = sh.querySelector('#spErr'); e.textContent = 'اختر النوع أو المقاس أولاً'; e.hidden = false; return false; }
      cartAdd(p.id, vid, qty);
      return true;
    };
    sh.querySelector('#spAdd').addEventListener('click', () => { if (take()) { closeSheet(); toast(`أُضيف «${p.name}» إلى السلة`); } });
    sh.querySelector('#spNow').addEventListener('click', () => { if (take()) sfCheckoutSheet(); });
    draw();
  });
}

function sfCartSheet() {
  const draw = () => {
    const lines = cartLines();
    if (!lines.length) {
      openSheet(`${sheetHead('السلة')}<div class="empty">سلتك فارغة. اختر منتجاً وأضفه للسلة.</div>
        <div class="actions"><button class="btn primary" type="button" data-act="close-sheet">تصفّح المنتجات</button></div>`);
      return;
    }
    openSheet(`${sheetHead('السلة')}
      <div id="cartLines">${lines.map((l, i) => `<div class="cline">${tile(l.p, 'thumb')}
        <div class="grow"><div class="trunc" style="font-weight:500">${esc(l.p.name)}</div>
          <div class="sub">${showLabel(l.p, l.v) ? `${esc(l.v.label)} · ` : ''}${money(effPrice(l.p, l.v))}</div>
          <button type="button" class="x" data-crm="${esc(i)}">حذف</button></div>
        <div class="qty"><button type="button" data-cinc="${esc(i)}" aria-label="زيادة">+</button><span class="num">${l.qty}</span><button type="button" data-cdec="${esc(i)}" aria-label="إنقاص">−</button></div></div>`).join('')}</div>
      <div class="sum-box"><div class="tot grand" style="border:0;margin:0;padding:0"><span>مجموع المنتجات</span><span>${money(cartSub())}</span></div>
        <div class="sub" style="margin-top:4px">أجرة التوصيل تُحسب حسب المحافظة في الخطوة التالية.</div></div>
      <div class="actions"><button class="btn" type="button" data-act="close-sheet">متابعة التسوق</button><button class="btn primary" type="button" id="toCheckout">إكمال الطلب</button></div>`,
    (sh) => {
      sh.querySelector('#cartLines').addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        const ls = cartLines();
        const i = Number(t.dataset.cinc ?? t.dataset.cdec ?? t.dataset.crm);
        const l = ls[i];
        if (!l) return;
        const c = cart.find((x) => x.pid === l.p.id && x.vid === l.v.id);
        if (t.dataset.cinc != null) c.qty = Math.min(99, c.qty + 1);
        else if (t.dataset.cdec != null) c.qty = Math.max(1, c.qty - 1);
        else cart = cart.filter((x) => x !== c);
        lsSet(cartKey(), cart);
        sfCartUI();
        draw();
      });
      sh.querySelector('#toCheckout').addEventListener('click', sfCheckoutSheet);
    });
  };
  draw();
}

      coupon = { code: data.code, discount: Number(data.discount) || 0 };
      msg.textContent = `تم تطبيق ${data.type === 'percent' ? `خصم ${data.value}%` : 'الخصم'} ✓`; msg.style.color = 'var(--good)';

      else if (!cust.city) err = ORDER_ERRORS.BAD_CITY;
      else if (cust.address.length < 3) err = ORDER_ERRORS.BAD_ADDRESS;
      if (err) { errEl.textContent = err; errEl.hidden = false; return; }
      errEl.hidden = true;
      lsSet('rawaj-customer', cust);
      const btn = sh.querySelector('#coSend');
      btn.disabled = true; btn.textContent = 'جارٍ إرسال الطلب…';
      const address = cust.landmark ? `${cust.address} — قرب ${cust.landmark}` : cust.address;
      let res;
      try {
        res = await sb.rpc('place_order', {
          p_slug: s.slug,
          p_items: cartLines().map((l) => ({ productId: l.p.id, variantId: l.v.id, qty: l.qty })),
          p_customer: { name: cust.name, phone: cust.phone, city: cust.city, address },
          p_note: v('#coNote'),
          ...(coupon ? { p_coupon: coupon.code } : {}),
        });
      } catch (x) { res = { error: x }; }
      if (res.error || !res.data) {
        const code = Object.keys(ORDER_ERRORS).sort((a, b) => b.length - a.length).find((k) => String((res.error && res.error.message) || '').includes(k));
        if (code && code.startsWith('COUPON') || code === 'BAD_COUPON') { coupon = null; drawFee(); }
        errEl.textContent = code ? ORDER_ERRORS[code] : 'تعذّر إرسال الطلب، تحقق من الإنترنت وحاول مرة ثانية';

      mine.unshift({ no: o.no, phone: cust.phone, at: Date.now() });

      if (!sfPublic) checkNewOrders().catch(() => {});

/* ---------------- Al-Waseet delivery (edge function "waseet") ----------------
   The owner connects their Al-Waseet merchant account in settings; confirmed orders can then be sent
   to Al-Waseet and their delivery status is tracked here and on the customer's "track your order" page. */
const WS = { status: {}, cities: null, sizes: null, regions: {}, synced: {} };
const WS_SEND_FROM = new Set(['confirmed', 'preparing']);
const WS_ALIAS = { 'نينوى': 'موصل', 'الأنبار': 'انبار', 'القادسية': 'ديوانيه', 'ذي قار': 'ناصريه', 'المثنى': 'سماوه', 'ميسان': 'عماره', 'بابل': 'حله', 'واسط': 'كوت', 'صلاح الدين': 'صلاح' };
const wsArr = (d) => (Array.isArray(d) ? d : d && typeof d === 'object' ? Object.values(d) : []);
const wsLabel = (x) => String(x.city_name || x.region_name || x.size || x.name || x.title || x.id);
const wsRef = (o) => String(o.waseet.qrId || o.waseet.id || '');
const wsSafeUrl = (u) => (/^https:\/\//i.test(String(u || '')) ? String(u) : '');
const wsNorm = (t) => String(t || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/(^|\s)ال/g, '$1').replace(/\s+/g, '');
function wsNameMatch(name, city) {
  const a = wsNorm(name), b = wsNorm(city);
  if (!a || !b) return false;
  if (a === b || a.includes(b) || b.includes(a)) return true;
  return !!WS_ALIAS[city] && a.includes(wsNorm(WS_ALIAS[city]));
}
async function wsCall(action, payload) {
  const s = store();
  const { data: ss } = await sb.auth.getSession();
  const tok = ss && ss.session ? ss.session.access_token : '';
  const body = Object.assign({ action }, payload || {});
  if (s && state.adminAs) body.store_id = s.id;
  let r;
  try {
    r = await fetch(`${SUPA_URL}/functions/v1/waseet`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: `Bearer ${tok || SUPA_KEY}` }, body: JSON.stringify(body) });
  } catch (e) { return { ok: false, msg: 'تعذّر الاتصال، تحقق من الإنترنت' }; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.msg) j.msg = 'تعذّر الاتصال بخدمة التوصيل';
  return j;
}
async function wsStatus(s) {
  if (WS.status[s.id]) return WS.status[s.id];
  const j = await wsCall('status');
  if (typeof j.connected === 'boolean') WS.status[s.id] = j;
  return j;
}
function wsReset(s) { WS.status[s.id] = null; WS.cities = null; WS.sizes = null; WS.regions = {}; }

async function fillWaseet(s) {
  if (!$('#wsBox')) return;
  const st = await wsStatus(s);
  const b = $('#wsBox');
  if (!b || store() !== s) return;
  if (st.connected) {

// Pulls the latest Al-Waseet status for the given orders (25 per request). Returns how many changed, -1 on error.
async function wsSync(s, list, force) {
  const now = Date.now();
  const todo = list.filter((o) => o.waseet && wsRef(o) && (force || ((!o.waseet.checkedAt || now - o.waseet.checkedAt > 10 * 60e3) && o.status === 'shipped')));
  if (!todo.length) return 0;
  let changed = 0;
  for (let i = 0; i < todo.length; i += 25) {
    const chunk = todo.slice(i, i + 25);
    const j = await wsCall('track', { ids: chunk.map(wsRef) });
    if (!j.ok) { if (changed) save(); return changed || -1; }
    for (const o of chunk) {
      const ref = wsRef(o);
      const it = (j.data || []).find((x) => x.qr_id === ref || x.id === ref);
      o.waseet.checkedAt = now;
      if (!it) continue;
      if (it.status !== o.waseet.status || (it.notes || '') !== (o.waseet.notes || '')) {
        o.waseet.status = it.status || ''; o.waseet.statusId = it.status_id; o.waseet.notes = it.notes || ''; changed++;
      }
      if (o.status === 'shipped' && can('orders.write') && /تم\s*(ال)?تسليم/.test(it.status || '') && changeStatus(o, 'delivered')) changed++;
    }
  }
  save();
  return changed;
}
async function wsAutoSync(s) {
  if (WS.synced[s.id] && Date.now() - WS.synced[s.id] < 5 * 60e3) return;
  const list = s.orders.filter((o) => o.waseet && o.status === 'shipped');
  if (!list.length) return;
  WS.synced[s.id] = Date.now();
  const n = await wsSync(s, list, false);
  if (n > 0 && store() === s && state.view === 'orders' && !$('#sheet').classList.contains('open')) { render(); toast(`تحدّثت حالة ${n} طلب من الوسيط`); }
}

  $('#supForm').addEventListener('submit', (e) => { e.preventDefault(); supAsk($('#supQ').value); });
  $('#supQ').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); supAsk($('#supQ').value); } });

})();
(async function boot() {
  loadUI();
  renderLoading();
  const pub = routePublic(); // a customer opening a store link sees the store right away
  try {
    const recovering = /type=recovery/.test(location.hash);
    const confirmed = /type=signup/.test(location.hash);
    const { data } = await sb.auth.getSession();
    if (confirmed) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
    if (recovering && data && data.session) { renderRecovery(); await pub; return; }
    if (confirmed) { authTab = 'login'; toast(data && data.session ? 'تم تأكيد بريدك ✅' : 'تم تأكيد بريدك ✅ سجّل الدخول الآن'); }
    if (data && data.session) await loadAccount(data.session.user);
  } catch (e) {
    toast('تعذّر الاتصال بالسيرفر، تحقق من الإنترنت', true);
  }
  render();
  await pub;
})();
</script>

  const textRec = new WeakMap();

  const trans = (s) => s.replace(RX, (m, pre, k) => pre + DICT[k]);
  // Shows the English text in English mode and the original Arabic in Arabic mode; keeps the Arabic original so switching back restores it.

    if (lang !== 'en') return { value: src, rec: null };

        if (cur == null) continue;
        const r = pick(cur, rec[a]);
        if (r.value !== cur) el.setAttribute(a, r.value);
